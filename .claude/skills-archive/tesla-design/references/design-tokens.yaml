colors:
  electric-blue: "#3E6AE1"
  promo-blue: "#3E6AE1"
  pure-white: "#FFFFFF"
  light-ash: "#F4F4F4"
  carbon-dark: "#171A20"
  frosted-glass: "rgba(255, 255, 255, 0.75)"
  graphite: "#393C41"
  pewter: "#5C5E62"
  silver-fog: "#8E8E8E"
  cloud-gray: "#EEEEEE"
  pale-silver: "#D0D1D2"
  overlay-gray: "rgba(128,128,128,0.65)"
  subtle-shadow: "rgba(0,0,0,0.05)"

typography:
  hero-title:
    fontFamily: "Universal Sans Display, -apple-system, Arial, sans-serif"
    fontSize: 40px
    fontSizeRem: 2.50rem
    fontWeight: 500
    lineHeight: 48px
    letterSpacing: normal
  product-name:
    fontFamily: "Universal Sans Text, -apple-system, Arial, sans-serif"
    fontSize: 17px
    fontSizeRem: 1.06rem
    fontWeight: 500
    lineHeight: 20px
    letterSpacing: normal
  nav-item:
    fontFamily: "Universal Sans Text, -apple-system, Arial, sans-serif"
    fontSize: 14px
    fontSizeRem: 0.88rem
    fontWeight: 500
    lineHeight: 16.8px
    letterSpacing: normal
  body-text:
    fontFamily: "Universal Sans Text, -apple-system, Arial, sans-serif"
    fontSize: 14px
    fontSizeRem: 0.88rem
    fontWeight: 400
    lineHeight: 20px
    letterSpacing: normal
  button-label:
    fontFamily: "Universal Sans Text, -apple-system, Arial, sans-serif"
    fontSize: 14px
    fontSizeRem: 0.88rem
    fontWeight: 500
    lineHeight: 16.8px
    letterSpacing: normal
  sub-link:
    fontFamily: "Universal Sans Text, -apple-system, Arial, sans-serif"
    fontSize: 14px
    fontSizeRem: 0.88rem
    fontWeight: 400
    lineHeight: 20px
    letterSpacing: normal
  promo-text:
    fontFamily: "Universal Sans Text, -apple-system, Arial, sans-serif"
    fontSize: 22px
    fontSizeRem: 1.38rem
    fontWeight: 400
    lineHeight: 20px
    letterSpacing: normal
  category-label:
    fontFamily: "Universal Sans Text, -apple-system, Arial, sans-serif"
    fontSize: 16px
    fontWeight: 500
    lineHeight: null
    letterSpacing: normal

rounded:
  none: 0px
  button: 4px
  category-card: 12px
  circle: 50%

spacing:
  base-unit: 8px
  common: [8px, 16px, 21.44px]
  button-padding-outer: 4px
  nav-item-padding: 4px 16px
  card-gap: 16px

components:
  button-primary-cta:
    backgroundColor: "{colors.electric-blue}"
    textColor: "{colors.pure-white}"
    fontSize: 14px
    fontWeight: 500
    padding: 4px
    rounded: "{rounded.button}"
    minHeight: 40px
    width: 200px
    border: "3px solid transparent"
    boxShadow: "rgba(0,0,0,0) 0px 0px 0px 2px inset"
    transition: "border-color 0.33s, background-color 0.33s, color 0.33s, box-shadow 0.25s"
  button-secondary-cta:
    backgroundColor: "{colors.pure-white}"
    textColor: "{colors.graphite}"
    rounded: "{rounded.button}"
    minHeight: 40px
    width: 200px
    transition: "0.33s"
  nav-button:
    backgroundColor: transparent
    textColor: "{colors.carbon-dark}"
    fontSize: 14px
    fontWeight: 500
    rounded: "{rounded.button}"
    padding: 4px 16px
    minHeight: 32px
    transition: "color 0.33s, background-color 0.33s"
  text-link:
    textColor: "{colors.pewter}"
    fontSize: 14px
    fontWeight: 400
    transition: "box-shadow 0.33s cubic-bezier(0.5, 0, 0, 0.75), color 0.33s"
  vehicle-card:
    backgroundColor: transparent
    border: none
    shadow: none
    layout: "3-column grid within dropdown panel"
  category-card:
    backgroundColor: "full-bleed landscape photography"
    rounded: "{rounded.category-card}"
    overflow: hidden
    aspectRatio: "~2:1"
  text-input:
    backgroundColor: transparent
    textColor: "{colors.carbon-dark}"
    placeholderColor: "{colors.silver-fog}"
    fontFamily: "Universal Sans Text"
    fontSize: 14px
  nav-desktop:
    backgroundColor: "{colors.pure-white}"
    stickyClass: "sticky-without-slide"
  nav-dropdown-panel:
    backgroundColor: "{colors.pure-white}"
    columns: 3
    shadow: none
    border: none
  persistent-chat-bar:
    backgroundColor: "{colors.pure-white}"
    border: subtle
    position: "fixed bottom"

elevation:
  level-0-flat:
    shadow: none
    use: "Default state for all elements"
  level-1-frost:
    treatment: "{colors.frosted-glass}"
    use: "Navigation bar on scroll"
  level-2-overlay:
    treatment: "{colors.overlay-gray}"
    use: "Modal overlays, cookie popups"
  level-3-subtle:
    treatment: "{colors.subtle-shadow}"
    use: "Minimal shadow hints on rare hover states"
