colors:
  jelly-mint: "#3cffd0"
  verge-ultraviolet: "#5200ff"
  console-mint-border: "#309875"
  deep-link-blue: "#3860be"
  focus-cyan: "#1eaedb"
  purple-rule: "#3d00bf"
  canvas-black: "#131313"
  surface-slate: "#2d2d2d"
  image-frame: "#313131"
  hazard-white: "#ffffff"
  absolute-black: "#000000"
  text-primary: "#ffffff"
  text-secondary: "#949494"
  text-muted: "#e9e9e9"
  text-inverted: "#131313"
  focus-ring: "#1eaedb"
  overlay-black: "rgba(0, 0, 0, 0.33)"
  dim-gray: "#8c8c8c"

typography:
  hero-wordmark:
    fontFamily: "Manuka, Impact, Helvetica"
    fontSize: 107px
    fontSizeRem: 6.69rem
    fontWeight: 900
    lineHeight: 0.80
    letterSpacing: 1.07px
  secondary-display:
    fontFamily: "Manuka, Impact, Helvetica"
    fontSize: 90px
    fontSizeRem: 5.63rem
    fontWeight: 900
    lineHeight: 0.80
  tertiary-display:
    fontFamily: "Manuka, Impact, Helvetica"
    fontSize: 60px
    fontSizeRem: 3.75rem
    fontWeight: 900
    lineHeight: 0.80
  large-headline:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 34px
    fontSizeRem: 2.13rem
    fontWeight: 700
    lineHeight: 1.00
  heading-wide:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 32px
    fontSizeRem: 2.00rem
    fontWeight: 400
    lineHeight: 1.10
    letterSpacing: 0.32px
  heading-medium:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 24px
    fontSizeRem: 1.50rem
    fontWeight: 700
    lineHeight: 1.00
  heading-small:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 20px
    fontSizeRem: 1.25rem
    fontWeight: 700
    lineHeight: 1.00
  light-capitalized-label:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 19px
    fontSizeRem: 1.19rem
    fontWeight: 300
    lineHeight: 1.20
    letterSpacing: 1.9px
  all-caps-label-xl:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 18px
    fontSizeRem: 1.13rem
    fontWeight: 400
    lineHeight: 1.10
    letterSpacing: 1.8px
    textTransform: uppercase
  bold-body:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 16px
    fontSizeRem: 1.00rem
    fontWeight: 700
    lineHeight: 1.00
  body-relaxed:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 16px
    fontSizeRem: 1.00rem
    fontWeight: 500
    lineHeight: 1.60
  inline-label:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 15px
    fontSizeRem: 0.94rem
    fontWeight: 400
    lineHeight: 1.20
    letterSpacing: 0.15px
  body-compact:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 13px
    fontSizeRem: 0.81rem
    fontWeight: 400
    lineHeight: 1.60
  eyebrow-all-caps:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 12px
    fontSizeRem: 0.75rem
    fontWeight: 400
    lineHeight: 1.30
    letterSpacing: 1.8px
    textTransform: uppercase
  tag-label:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 12px
    fontSizeRem: 0.75rem
    fontWeight: 400
    lineHeight: 1.20
    letterSpacing: 0.72px
    textTransform: uppercase
  caption-micro:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 11px
    fontSizeRem: 0.69rem
    fontWeight: 400
    lineHeight: 1.20
    letterSpacing: 1.1px
    textTransform: uppercase
  meta-nano:
    fontFamily: "PolySans, Helvetica, Arial"
    fontSize: 10px
    fontSizeRem: 0.63rem
    fontWeight: 500
    lineHeight: 1.40
    letterSpacing: 1.5px
    textTransform: uppercase
  mono-button-label:
    fontFamily: "PolySans Mono, Courier New, Courier"
    fontSize: 12px
    fontSizeRem: 0.75rem
    fontWeight: 600
    lineHeight: 2.00
    letterSpacing: 1.5px
    textTransform: uppercase
  mono-timestamp:
    fontFamily: "PolySans Mono, Courier New, Courier"
    fontSize: 11px
    fontSizeRem: 0.69rem
    fontWeight: 500-600
    lineHeight: 1.20
    letterSpacing: 1.1px-1.8px
    textTransform: uppercase
  serif-body:
    fontFamily: "FK Roman Standard, Georgia"
    fontSize: 16px
    fontSizeRem: 1.00rem
    fontWeight: 400
    lineHeight: 1.30
    letterSpacing: -0.16px
  serif-caption:
    fontFamily: "FK Roman Standard, Georgia"
    fontSize: 20px
    fontSizeRem: 1.25rem
    fontWeight: 400
    lineHeight: 1.20

fontFamilies:
  manuka: "Manuka, Impact, Helvetica"
  polysans: "PolySans, Helvetica, Arial"
  polysans-mono: "PolySans Mono, Courier New, Courier"
  fk-roman: "FK Roman Standard, Georgia"
  roboto-utility: "Roboto, -apple-system, system-ui"

rounded:
  xs: 2px
  sm: 3px
  md: 4px
  lg: 20px
  xl: 24px
  xxl: 30px
  xxxl: 40px
  circle: 50%

spacing:
  base-unit: 8px
  scale: [1px, 2px, 4px, 5px, 6px, 8px, 9px, 10px, 12px, 14px, 15px, 16px, 20px, 24px, 25px]
  section-padding: 32px-64px
  storystream-gap: 12px-16px
  card-padding: 20px-32px
  feature-card-padding: 40px-48px

components:
  button-primary-mint-pill:
    backgroundColor: "{colors.jelly-mint}"
    textColor: "{colors.absolute-black}"
    typography: "PolySans 16/700 or PolySans Mono 12/600 uppercase"
    rounded: 24px
    padding: 10px 24px
    hoverBackground: "rgba(255, 255, 255, 0.2)"
    activeBackground: "rgba(140, 140, 140, 0.87)"
    focusBackground: "{colors.focus-cyan}"
  button-secondary-dark-slate:
    backgroundColor: "{colors.surface-slate}"
    textColor: "{colors.text-muted}"
    typography: "PolySans 16/400"
    rounded: 24px
    padding: 10px 24px
  button-tertiary-outlined-mint:
    backgroundColor: transparent
    textColor: "{colors.jelly-mint}"
    border: "1px solid {colors.jelly-mint}"
    typography: "PolySans Mono 12/600 uppercase, 1.5px tracking"
    rounded: 40px
    padding: 10px 20px
  button-outlined-ultraviolet:
    backgroundColor: transparent
    textColor: "{colors.verge-ultraviolet} or {colors.hazard-white}"
    border: "1px solid {colors.verge-ultraviolet}"
    rounded: 30px
  pill-tag:
    backgroundColor: "saturated accent"
    textColor: "black or white by luminance"
    rounded: 20px
    padding: 4px 10px
    typography: "PolySans Mono 11/600 uppercase, 1.8px tracking"
  storystream-tile:
    backgroundColor: "{colors.canvas-black} + 1px white border, or saturated fill"
    rounded: "20px standard / 24px feature"
    padding: 24px-32px
  feature-card-top-story:
    backgroundColor: "{colors.canvas-black} with hairline border, or full-bleed color"
    rounded: 24px
    padding: "32px+"
  storystream-rail:
    railColor: "{colors.purple-rule} or {colors.hazard-white}"
    timestampTypography: "PolySans Mono 11/500 uppercase, 1.1px tracking"
    itemGap: 12px-16px
  text-input:
    backgroundColor: "{colors.canvas-black}"
    border: "1px solid {colors.hazard-white} or {colors.text-secondary}"
    rounded: 2px
    typography: "PolySans 15px"
    focusBorder: "{colors.jelly-mint}"
    errorBorder: "{colors.verge-ultraviolet}"
  top-nav:
    backgroundColor: "{colors.canvas-black}"
    ctaButton: "mint pill"
    hoverColor: "{colors.deep-link-blue}"

shadows:
  level-2-image-frame: "1px solid {colors.hazard-white} or {colors.image-frame}"
  level-3-active-outline: "1px solid {colors.jelly-mint}"
  level-4-promo-outline: "1px solid {colors.verge-ultraviolet}"
  level-5-atmospheric-ring: "rgba(0, 0, 0, 0.33) 0px 0px 0px 1px"
  level-6-active-tab-underline: "0px -1px 0px 0px inset"
