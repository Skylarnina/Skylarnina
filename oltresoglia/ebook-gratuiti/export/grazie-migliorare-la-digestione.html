<!doctype html>
<html lang="it">

<title>OLTRESOGLIA Migliorare la digestione</title>
<style>/* OLTRESOGLIA type system. Spec: ../TYPOGRAPHY.md
   The ONLY file allowed to set font-size, line-height, letter-spacing, font-weight or text-transform.
   Every text element on every page carries exactly one role class: .t-display … .t-nav.
   A size that isn't a role doesn't exist: use the nearest role. */

/* Stand-ins until the Bounded files arrive: Archivo (200 / 400 / 900). Manrope is the real font,
   served by Google Fonts until self-hosted copies are added to ../fonts/. */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@200;400;900&family=Manrope:wght@300;400;500;600&display=swap');

/* Bounded: drop the three files into oltresoglia/fonts/ with these names and every page switches over. */
@font-face { font-family: 'Bounded'; src: url('../../fonts/bounded-black.woff2') format('woff2'), url('../../fonts/bounded-black.ttf') format('truetype'); font-weight: 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Bounded'; src: url('../../fonts/bounded-regular.woff2') format('woff2'), url('../../fonts/bounded-regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Bounded'; src: url('../../fonts/bounded-extralight.woff2') format('woff2'), url('../../fonts/bounded-extralight.ttf') format('truetype'); font-weight: 200; font-style: normal; font-display: swap; }

:root {
  /* Families */
  --font-display: 'Bounded', 'Archivo', sans-serif;
  --font-text: 'Manrope', ui-sans-serif, system-ui, sans-serif;

  /* The 12 role sizes (1440 / 1024 / 390 resolve to the table in TYPOGRAPHY.md) */
  --t-display: clamp(52px, 7.8vw, 112px);
  --t-h1: clamp(36px, 4.5vw, 64px);
  --t-h2: clamp(28px, 2.8vw, 40px);
  --t-h3: clamp(20px, 1.7vw, 24px);
  --t-statement: clamp(30px, 3.4vw, 48px);
  --t-numeral: var(--t-h1);
  --t-eyebrow: 11px;
  --t-lead: clamp(17px, 1.4vw, 20px);
  --t-body: 16px;
  --t-small: 13px;
  --t-button: 13px;
  --t-nav: 14px;

  /* Spacing tied to the type */
  --space-section: clamp(72px, 11vw, 160px);
  --space-eyebrow: 16px;   /* eyebrow → heading */
  --space-heading: clamp(16px, 1.7vw, 24px);   /* heading → lead / body */

  /* Ink: the colour the opacities are taken from. Uses the page's own Porcelain / Saffron tokens
     when they exist (colours are not this file's job); the spec hexes are the fallback. */
  --type-ink: var(--oltre-porcelain, #F4F1EA);
  --type-accent: var(--oltre-saffron-mango, #EFC04E);
}

/* On a light (Porcelain) ground the same opacities are taken from Dark Charcoal instead.
   The mixes are declared on every element (not once on :root) so this override reaches them. */
.on-light { --type-ink: var(--oltre-dark-charcoal, #050505); }
* {
  --type-ink-read: color-mix(in srgb, var(--type-ink) 64%, transparent);   /* lead, body */
  --type-ink-quiet: color-mix(in srgb, var(--type-ink) 40%, transparent);  /* small, eyebrow, placeholders */
}

/* ---------- Roles ---------- */
.t-display   { font: 900 var(--t-display)/0.92 var(--font-display); text-transform: uppercase; letter-spacing: -0.02em; max-width: 10ch; }
.t-h1        { font: 900 var(--t-h1)/1 var(--font-display); text-transform: uppercase; letter-spacing: -0.01em; max-width: 14ch; }
.t-h2        { font: 900 var(--t-h2)/1.05 var(--font-display); text-transform: uppercase; letter-spacing: 0; max-width: 18ch; }
.t-h3        { font: 400 var(--t-h3)/1.2 var(--font-display); text-transform: none; letter-spacing: 0; max-width: 28ch; }
.t-statement { font: 200 var(--t-statement)/1.1 var(--font-display); text-transform: none; letter-spacing: -0.01em; max-width: 24ch; }
.t-numeral   { font: 900 var(--t-numeral)/1 var(--font-display); letter-spacing: -0.02em; }
.t-eyebrow   { font: 500 var(--t-eyebrow)/1.4 var(--font-text); text-transform: uppercase; letter-spacing: 0.14em; color: var(--type-ink-quiet); }
.t-lead      { font: 300 var(--t-lead)/1.5 var(--font-text); text-transform: none; letter-spacing: 0; max-width: 56ch; color: var(--type-ink-read); }
.t-body      { font: 400 var(--t-body)/1.6 var(--font-text); text-transform: none; letter-spacing: 0; max-width: 64ch; color: var(--type-ink-read); }
.t-small     { font: 400 var(--t-small)/1.5 var(--font-text); text-transform: none; letter-spacing: 0.01em; max-width: 48ch; color: var(--type-ink-quiet); }
.t-button    { font: 600 var(--t-button)/1 var(--font-text); text-transform: uppercase; letter-spacing: 0.12em; }
.t-nav       { font: 400 var(--t-nav)/1 var(--font-text); text-transform: none; letter-spacing: 0; }

/* Headings break into even lines (no single word left on the last line) */
:is(.t-display, .t-h1, .t-h2, .t-h3, .t-statement) { text-wrap: balance; }

/* Saffron eyebrow, only when it sits above an H1 */
.t-eyebrow.on-dark-accent { color: var(--type-accent); }

/* Placeholders follow the quiet opacity */
::placeholder { color: var(--type-ink-quiet); opacity: 1; }

/* One accent phrase per section, inside an H1 or Statement only */
.accent { color: var(--type-accent); }

/* Spacing helpers tied to the type */
.t-eyebrow + :is(.t-display, .t-h1, .t-h2) { margin-top: var(--space-eyebrow); }
:is(.t-display, .t-h1, .t-h2, .t-h3, .t-statement) + :is(.t-lead, .t-body) { margin-top: var(--space-heading); }
</style>
<style>
  :root {
    --oltre-blackout: #000000;
    --oltre-dark-charcoal: #050505;
    --oltre-porcelain: #EBF0F2;
    --oltre-whiteout: #FFFFFF;
    --oltre-saffron-mango: #EFC04D;
    --line-hair: color-mix(in srgb, var(--oltre-porcelain) 14%, transparent);
    --line-field: color-mix(in srgb, var(--oltre-porcelain) 28%, transparent);
    --line-strong: color-mix(in srgb, var(--oltre-porcelain) 50%, transparent);
    --btn-fill: var(--oltre-blackout);
    --btn-fill-hover: color-mix(in srgb, var(--oltre-saffron-mango) 14%, var(--oltre-blackout));
    --btn-glow: 0 0 18px color-mix(in srgb, var(--oltre-saffron-mango) 35%, transparent);
    --btn-glow-hover: 0 0 26px color-mix(in srgb, var(--oltre-saffron-mango) 50%, transparent);
    --radius-card: 6px;
    --t: 200ms;
    --ease: cubic-bezier(.76, 0, .24, 1);
    --edge: max(clamp(16px, 4vw, 48px), calc((100vw - 1232px) / 2 + 32px));
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { background: var(--oltre-dark-charcoal); color: var(--oltre-porcelain); }
  body { margin: 0; font-family: var(--font-text); -webkit-font-smoothing: antialiased; overflow-x: clip; isolation: isolate; }
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--oltre-dark-charcoal); pointer-events: none; }
  .backdrop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
  .backdrop::after { content: ''; position: absolute; inset: 0; background: var(--oltre-dark-charcoal); opacity: .45; }

  .card-dark { --type-ink: var(--oltre-porcelain); background: var(--oltre-dark-charcoal); color: var(--oltre-porcelain); border-radius: 20px; padding: 8px 24px;
    --line-hair: color-mix(in srgb, var(--oltre-porcelain) 14%, transparent);
    --line-field: color-mix(in srgb, var(--oltre-porcelain) 28%, transparent);
    --line-strong: color-mix(in srgb, var(--oltre-porcelain) 50%, transparent); }
  @media (min-width: 640px) { .card-dark { padding: 8px 40px; } }
  .card-dark :focus-visible { outline-color: var(--oltre-saffron-mango); }
  .card-dark .rows > li:first-child { border-top: 0; }
  .card-dark .rows > li:last-child { border-bottom: 0; }
  h1, h2, h3, p, figure, blockquote, ol, ul { margin: 0; }
  ol, ul { padding: 0; list-style: none; }
  a { color: inherit; text-decoration: none; }
  img { display: block; }
  button { color: inherit; }
  [hidden] { display: none !important; }
  ::selection { background: var(--oltre-saffron-mango); color: var(--oltre-dark-charcoal); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :where(a, button):focus-visible { outline: 2px solid var(--oltre-saffron-mango); outline-offset: 3px; }

  .photo { position: relative; overflow: hidden; background: color-mix(in srgb, var(--oltre-porcelain) 7%, var(--oltre-dark-charcoal)); }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }

  .rule { display: flex; align-items: center; gap: 14px; }
  .rule::after { content: ''; flex: 0 1 64px; min-width: 16px; height: 1px; background: currentColor; opacity: .7; }

  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 56px; padding: 0 28px;
    border: 2px solid var(--oltre-saffron-mango); border-radius: 999px; cursor: pointer;
    background: var(--btn-fill); color: var(--oltre-saffron-mango); box-shadow: var(--btn-glow);
    transition: background-color var(--t), box-shadow var(--t), transform var(--t);
  }
  .pill:hover { background: var(--btn-fill-hover); box-shadow: var(--btn-glow-hover); }
  .pill:active { transform: scale(.98); }
  .pill--sm { min-height: 44px; padding: 0 20px; }
  .tag { display: inline-flex; align-items: center; min-height: 36px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 999px; }
  .site-header { position: absolute; inset: 0 0 auto; z-index: 5; padding: 20px var(--edge) 0; }
  @media (min-width: 640px) { .site-header { padding-top: 32px; } }
  .site-header__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .wordmark { color: var(--oltre-whiteout); white-space: nowrap; max-width: none; }
  .nav { display: flex; align-items: center; gap: 12px; }
  .nav__links { display: none; gap: 4px; }
  .nav__links a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid transparent;
    color: color-mix(in srgb, var(--oltre-porcelain) 80%, transparent); transition: color var(--t), background-color var(--t); }
  .nav__links a:hover { color: var(--oltre-porcelain); background: color-mix(in srgb, var(--oltre-porcelain) 8%, transparent); }
  .nav__links a[aria-current="page"] { color: var(--oltre-porcelain); border-color: var(--line-strong); }
  .nav__menu {
    display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line-field); background: transparent; transition: border-color var(--t);
  }
  .nav__menu:hover { border-color: var(--line-strong); }
  .nav__panel { margin-top: 16px; border-top: 1px solid var(--line-hair); background: var(--oltre-dark-charcoal); }
  .nav__panel a { display: flex; align-items: center; min-height: 48px; border-bottom: 1px solid var(--line-hair); }
  .nav__panel a[aria-current="page"] { color: var(--oltre-saffron-mango); }
  @media (min-width: 960px) {
    .nav { gap: 24px; }
    .nav__links { display: flex; }
    .nav__menu, .nav__panel { display: none !important; }
  }

  .block { padding: var(--space-section) var(--edge); }
  .split { display: grid; gap: 32px; }
  @media (min-width: 960px) { .split { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 80px; } }
  .split > * { align-self: start; }
  .sticky { position: sticky; top: 112px; }
  @media (max-width: 959px) { .sticky { position: static; } }
  .rows > li { display: grid; gap: 16px; padding: 40px 0; border-top: 1px solid var(--line-hair); }
  .rows > li:last-child { border-bottom: 1px solid var(--line-hair); }
  @media (min-width: 640px) { .rows > li { grid-template-columns: 180px 1fr; gap: 40px; } }
  .rows .t-body + .t-body { margin-top: 14px; }


  .page-head { padding: 168px var(--edge) clamp(40px, 5vw, 64px); display: grid; gap: 24px; }
  @media (min-width: 960px) { .page-head { grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); gap: 80px; align-items: end; } }
  .page-head .t-lead { color: var(--oltre-porcelain); }
  .book { position: relative; width: var(--book-w, 180px); aspect-ratio: 2 / 3; flex: none; transform: perspective(900px) rotateY(-14deg); transform-origin: left center; }
  .book::before { content: ''; position: absolute; inset: -6% -22% -10% -16%; z-index: -1; border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--oltre-saffron-mango) 34%, transparent), transparent); filter: blur(22px); }
  .book__pages { position: absolute; top: 1.2%; bottom: 1.2%; right: -4.5%; width: 6%; border-radius: 0 3px 3px 0;
    background: linear-gradient(90deg, rgba(0,0,0,.35), transparent 40%), repeating-linear-gradient(0deg, #e9e6df 0 1px, #c9c5bc 1px 2px); }
  .book__cover { position: absolute; inset: 0; overflow: hidden; border-radius: 2px 6px 6px 2px; background: linear-gradient(160deg, #2a2c2e, #121314 60%);
    box-shadow: 0 18px 40px rgba(0,0,0,.55); display: flex; flex-direction: column; justify-content: space-between; padding: 12% 10%; }
  .book__cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); opacity: .75; mix-blend-mode: screen; }
  .book__cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.45), transparent 9%, transparent 92%, rgba(0,0,0,.25)); }
  .book__cover > p { position: relative; z-index: 1; max-width: none; }
  .book__cover .t-eyebrow { color: var(--oltre-saffron-mango); }
  .book__cover .t-small { color: color-mix(in srgb, var(--oltre-porcelain) 70%, transparent); }
  .is-white { background: var(--oltre-porcelain); color: var(--oltre-dark-charcoal); --type-ink: var(--oltre-dark-charcoal);
    --line-hair: color-mix(in srgb, var(--oltre-dark-charcoal) 14%, transparent);
    --line-field: color-mix(in srgb, var(--oltre-dark-charcoal) 28%, transparent);
    --line-strong: color-mix(in srgb, var(--oltre-dark-charcoal) 45%, transparent);
    --btn-glow: 0 0 0 transparent; --btn-glow-hover: 0 0 0 transparent;
    --btn-fill-hover: color-mix(in srgb, var(--oltre-saffron-mango) 22%, var(--oltre-blackout)); }
  .is-white :focus-visible { outline-color: var(--oltre-dark-charcoal); }
  .head-solid .site-header { position: relative; padding-bottom: 20px; background: var(--oltre-dark-charcoal); }
  @media (min-width: 640px) { .head-solid .site-header { padding-bottom: 32px; } }
  .shelf-wrap { padding: var(--space-section) clamp(16px, 3.4vw, 48px); }
  .shelf { display: grid; gap: 20px; padding: clamp(12px, 2.4vw, 32px); border-radius: 24px; border: 1px solid var(--line-hair);
    background: radial-gradient(120% 70% at 50% 115%, color-mix(in srgb, var(--oltre-saffron-mango) 22%, transparent), transparent 62%),
                color-mix(in srgb, var(--oltre-whiteout) 45%, var(--oltre-porcelain)); }
  @media (min-width: 960px) { .shelf { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .ecard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(20px, 2.4vw, 32px); align-items: center; padding: clamp(20px, 2.4vw, 32px);
    border-radius: 16px; border: 1px solid color-mix(in srgb, var(--oltre-saffron-mango) 45%, transparent);
    background: linear-gradient(180deg, var(--oltre-whiteout) 35%, color-mix(in srgb, var(--oltre-saffron-mango) 14%, var(--oltre-whiteout)));
    --book-w: clamp(116px, 10.5vw, 156px); }
  .ecard__text { display: grid; justify-items: start; gap: 16px; }
  .ecard__text .t-h2::before, .ebook__text .t-h1::before { content: ''; display: block; width: 32px; height: 2px; margin-bottom: 16px; background: var(--oltre-saffron-mango); }
  .ecard .pill { margin-top: 4px; }
  @media (max-width: 639px) {
    .ecard { grid-template-columns: 1fr; justify-items: center; text-align: left; --book-w: 150px; }
    .ecard__text { justify-items: stretch; }
    .ecard .pill { width: 100%; }
  }
  .ebook-more { padding: var(--space-section) var(--edge); }
  .grazie { padding: clamp(64px, 8vw, 120px) var(--edge) var(--space-section); min-height: 0; }
  .ebook { min-height: min(100svh, 860px); display: grid; align-items: center; gap: 48px; padding: 168px var(--edge) var(--space-section); --book-w: clamp(200px, 24vw, 320px); }
  @media (min-width: 960px) { .ebook { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 80px; } }
  .ebook__media { display: grid; place-items: center; }
  .ebook__text { display: grid; justify-items: start; gap: 24px; }
  .ebook__text .t-eyebrow { margin-bottom: -8px; }
  .crumb { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .pop { width: min(940px, calc(100vw - 32px)); max-height: calc(100svh - 32px); padding: 8px; border: 0; border-radius: 28px; background: var(--oltre-porcelain); color: var(--oltre-porcelain); overflow: auto; }
  .pop::backdrop { background: color-mix(in srgb, var(--oltre-dark-charcoal) 72%, transparent); backdrop-filter: blur(3px); }
  .pop__panel { position: relative; border-radius: 22px; padding: clamp(28px, 4vw, 48px); display: grid; gap: 32px;
    background: radial-gradient(60% 50% at 25% 70%, color-mix(in srgb, var(--oltre-saffron-mango) 20%, transparent), transparent 70%), var(--oltre-dark-charcoal); }
  .pop__close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 99px; border: 1px solid var(--line-field); background: none; cursor: pointer; display: grid; place-items: center; }
  .pop__close:hover { border-color: var(--oltre-saffron-mango); color: var(--oltre-saffron-mango); }
  .pop__head { display: grid; justify-items: center; text-align: center; gap: 8px; }
  .pop__head .t-h1 { margin-top: 12px; }
  .pop__body { display: grid; gap: 32px; align-items: center; --book-w: clamp(150px, 18vw, 220px); }
  @media (min-width: 760px) { .pop__body { grid-template-columns: auto minmax(0, 1fr); gap: 48px; } }
  .pop__body .book { justify-self: center; }
  .pop form { display: grid; gap: 16px; }
  .field { display: grid; }
  .field__box { position: relative; }
  .field__box svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--oltre-porcelain); pointer-events: none; }
  .field input { width: 100%; min-height: 56px; padding: 0 16px 0 48px; border-radius: 12px; color: var(--oltre-porcelain); max-width: none;
    background: color-mix(in srgb, var(--oltre-porcelain) 6%, transparent); border: 1px solid var(--line-field); transition: border-color var(--t); }
  .field input:focus-visible { outline: 2px solid var(--oltre-saffron-mango); outline-offset: 2px; }
  .field [data-valid="true"] { border-color: var(--line-strong); }
  .field [aria-invalid="true"] { border-color: var(--oltre-saffron-mango); }
  .field__msg { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; color: var(--oltre-porcelain); }
  .field__msg svg { width: 16px; height: 16px; margin-top: 2px; flex: none; color: var(--oltre-saffron-mango); }
  .pop .pill { width: 100%; margin-top: 8px; }
  .pop__note { text-align: center; margin-inline: auto; }
</style>
