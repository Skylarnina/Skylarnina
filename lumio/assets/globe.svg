<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" preserveAspectRatio="xMidYMid slice">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.480 -0.192"/>
</filter>

<radialGradient id="shade" cx="0.36" cy="0.32" r="0.72">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
  <stop offset="0.85" stop-color="#000" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/>
</radialGradient>
<clipPath id="c"><circle cx="300" cy="300" r="230"/></clipPath>
<filter id="land" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="7"/>
  <feColorMatrix type="matrix" values="0 0 0 0 0.28  0 0 0 0 0.28  0 0 0 0 0.27  5 0 0 0 -2.1"/>
  <feGaussianBlur stdDeviation="0.8"/>
</filter>
<filter id="b20" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>

</defs>

<rect width="600" height="600" fill="#DEDCD6"/><ellipse cx="320" cy="560" rx="220" ry="26" fill="#8D8A84" opacity="0.4" filter="url(#b20)"/>
<g clip-path="url(#c)">
  <circle cx="300" cy="300" r="230" fill="#A9A7A2"/>
  <rect width="600" height="600" filter="url(#land)"/>
  <circle cx="300" cy="300" r="230" fill="url(#shade)"/>
</g>

<rect width="600" height="600" filter="url(#grain)" opacity="1"/>
</svg>
