<!doctype html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domanda 6 — Test Oltresoglia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
/* ───────────── Oltresoglia tokens ─────────────
   Brand colours come from "Source Files – Oltresoglia" (Figma):
   Dark Charcoal #050505 · Saffron Mango #EFC04D · Porcelain #EBF0F2 · BlackOut #000 · WhiteOut #FFF.
   Typeface: Manrope. The funnel commits to the Dark Charcoal variant of the brand. */
:root {
  color-scheme: dark;
  --charcoal: #050505;        /* ground */
  --surface: #0F1112;         /* cards — charcoal lifted, cool bias toward Porcelain */
  --surface-2: #171A1C;       /* hover */
  --line: rgba(235, 240, 242, .10);
  --line-strong: rgba(235, 240, 242, .22);
  --porcelain: #EBF0F2;       /* text */
  --muted: #9CA3A7;           /* Porcelain at reading-grey */
  --faint: #697075;
  --saffron: #EFC04D;         /* accent */
  --saffron-hi: #F5CF6E;
  --saffron-soft: rgba(239, 192, 77, .09);
  --saffron-line: rgba(239, 192, 77, .62);
  --error: #FF7A6B;

  --r-card: 12px;
  --r-btn: 12px;
  --r-tile: 8px;
  --slant: -10deg;            /* forward lean of the wordmark and icon */
  --shadow: inset 0 1px 0 rgba(235, 240, 242, .04), 0 12px 30px -16px rgba(0, 0, 0, .9);
  --ease-out: cubic-bezier(.2, .8, .2, 1);

  --f: "Manrope", "Helvetica Neue", Arial, sans-serif;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--charcoal);
  color: var(--porcelain);
  font: 450 16px/1.5 var(--f);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* Faint saffron light at the top that grows with progress */
body::before {
  content: "";
  position: fixed;
  left: 50%; top: -42vh;
  width: 130vmax; height: 80vh;
  translate: -50% 0;
  background: radial-gradient(closest-side, rgba(239, 192, 77, .16), rgba(239, 192, 77, .04) 55%, transparent 75%);
  opacity: calc(.2 + var(--heat, 0) * .8);
  transition: opacity 1.2s var(--ease-out);
  pointer-events: none;
  z-index: 1;
}

/* ───────────── Background photo ─────────────
   Full-bleed training photo behind every screen. Shown in black and white so Saffron stays the only colour,
   under a Charcoal gradient that deepens toward the bottom, where answers and buttons sit.
   Strength changes per screen: strongest on the entry screen, quiet behind the questions. */
.photo {
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .9s var(--ease-out);
}
.photo.ready { opacity: var(--photo-strength, .9); }
.photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: var(--photo-focus, 50% 30%);
  filter: grayscale(1) contrast(1.12) brightness(.92);
}
.photo::after {
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(5, 5, 5, .72) 0%, rgba(5, 5, 5, .58) 18%, rgba(5, 5, 5, .7) 34%, rgba(5, 5, 5, .86) 55%, #050505 84%),
    radial-gradient(130% 90% at 50% 25%, transparent 40%, rgba(5, 5, 5, .7));
}
body[data-screen="intro"]      { --photo-strength: 1; }
/* Entry: the people sit in the empty band between the profile chips and the button, so the scrim opens up there */
body[data-screen="intro"] .photo::after {
  background:
    linear-gradient(180deg, rgba(5, 5, 5, .86) 0%, rgba(5, 5, 5, .8) 40%, rgba(5, 5, 5, .38) 60%, rgba(5, 5, 5, .4) 76%, rgba(5, 5, 5, .92) 88%, #050505 100%),
    radial-gradient(120% 70% at 60% 65%, transparent 45%, rgba(5, 5, 5, .55));
}
body[data-screen="q"],
body[data-screen="email"]      { --photo-strength: .38; }
body[data-screen="processing"] { --photo-strength: .55; }
body[data-screen="result"]     { --photo-strength: .7; }
@media (min-width: 720px) {
  .photo::after {
    background:
      linear-gradient(180deg, rgba(5, 5, 5, .55), rgba(5, 5, 5, .72) 60%, rgba(5, 5, 5, .9)),
      radial-gradient(60% 90% at 50% 45%, rgba(5, 5, 5, .55), transparent 90%);
  }
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ───────────── Shell ───────────── */
.app {
  position: relative; z-index: 2;
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 20px;
  box-sizing: border-box;
  display: flex; flex-direction: column;
}
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 3;
  height: 64px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 14px;
}
.bar[data-mode="brand"] { display: flex; justify-content: space-between; }
.bar[data-mode="brand"] .back,
.bar[data-mode="brand"] .progress,
.bar[data-mode="brand"] .count { display: none; }
.bar[data-mode="progress"] .wordmark { display: none; }
.bar.no-back .back { visibility: hidden; }

.wordmark { width: 148px; height: auto; color: var(--porcelain); display: block; }

.back {
  all: unset; box-sizing: border-box;
  width: 44px; height: 44px; margin-left: -10px;
  border-radius: 10px;
  display: grid; place-items: center;
  color: var(--muted);
  cursor: pointer;
  transition: background .2s, color .2s;
}
.back:hover { background: var(--surface); color: var(--porcelain); }
.back:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }

/* Progress: one slanted segment per question, leaning like the wordmark */
.progress { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; padding-inline: 2px; }
.seg {
  position: relative;
  height: 5px;
  transform: skewX(var(--slant));
  border-radius: 1.5px;
  background: var(--line-strong);
  overflow: hidden;
}
.seg::after {
  content: ""; position: absolute; inset: 0;
  background: var(--saffron);
  transform: scaleX(0); transform-origin: left;
  transition: transform .5s var(--ease-out);
}
.seg.done::after { transform: scaleX(1); }
.seg.now::after { transform: scaleX(.4); animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
.count {
  font: 700 13px/1 var(--f);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
}

.stage { flex: 1; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; padding-block: 8px 0; }

/* ───────────── Type ───────────── */
.eyebrow {
  margin: 0;
  font: 700 12px/1.2 var(--f);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--saffron);
}
.eyebrow .dim { color: var(--faint); }
.display, .h2, .q-title {
  margin: 0;
  font-family: var(--f);
  font-weight: 800;
  letter-spacing: -.03em;
  text-wrap: balance;
}
.display { font-size: clamp(34px, 9.4vw, 50px); line-height: 1.04; margin-top: 16px; }
.h2 { font-size: clamp(27px, 7.4vw, 36px); line-height: 1.1; }
.q-title { font-size: clamp(24px, 6.6vw, 32px); line-height: 1.16; margin-top: 12px; }
h1:focus { outline: none; }
.saffron { color: var(--saffron); }
.lede {
  margin: 14px 0 0;
  max-width: 32em;
  font-size: 17px; line-height: 1.5;
  color: var(--muted);
  text-wrap: pretty;
}
.label {
  margin: 0 0 10px;
  font: 700 11.5px/1 var(--f);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}

/* ───────────── Buttons ───────────── */
.btn {
  all: unset; box-sizing: border-box;
  width: 100%; min-height: 58px; padding: 0 22px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  border-radius: var(--r-btn);
  background: var(--saffron);
  color: var(--charcoal);
  font: 800 17px/1 var(--f);
  letter-spacing: -.01em;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 16px 34px -18px rgba(239, 192, 77, .7);
  transition: background .2s, transform .12s var(--ease-out), opacity .2s;
  user-select: none;
}
.btn .arr { transition: transform .25s var(--ease-out); }
@media (hover: hover) {
  .btn:hover { background: var(--saffron-hi); }
  .btn:hover .arr { transform: translateX(3px); }
}
.btn:active { transform: scale(.975); }
.btn:focus-visible { outline: 2px solid var(--porcelain); outline-offset: 3px; }
.btn[aria-busy="true"] { opacity: .75; pointer-events: none; }

.btn-text {
  all: unset; box-sizing: border-box;
  display: block; margin: 6px auto 0;
  min-height: 44px; padding: 0 14px;
  border-radius: 10px;
  color: var(--muted);
  font: 600 15px/44px var(--f);
  cursor: pointer;
}
.btn-text:hover { color: var(--porcelain); }
.btn-text:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }

.dock {
  position: sticky; bottom: 0; z-index: 2;
  margin-top: auto;
  padding-block: 28px calc(16px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(rgba(5, 5, 5, 0), var(--charcoal) 40%);
}
.meta {
  margin: 14px 0 0;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 6px 10px;
  font: 700 11px/1 var(--f);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--faint);
}
.meta span + span::before { content: "·"; margin-right: 10px; color: var(--line-strong); }
.hint {
  margin: 0; min-height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  text-align: center;
  font-size: 14px;
  color: var(--faint);
}
.kbd { display: none; font: 700 10.5px/1 var(--f); letter-spacing: .12em; text-transform: uppercase; }
@media (hover: hover) and (pointer: fine) { .kbd { display: block; } }

/* ───────────── Entry ───────────── */
.intro .eyebrow { margin-top: 22px; }
.profiles { margin-top: 30px; }
.profile-row {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
}
.profile-row li {
  padding: 14px 4px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  font: 800 12.5px/1 var(--f);
  letter-spacing: .12em;
  color: var(--porcelain);
  background: rgba(15, 17, 18, .7);
}

/* ───────────── Answer cards ───────────── */
.opts { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
.opt {
  all: unset; box-sizing: border-box;
  min-height: 64px;
  padding: 14px 16px 14px 14px;
  display: grid;
  grid-template-columns: 30px 1fr 22px;
  align-items: center;
  gap: 14px;
  border-radius: var(--r-card);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: border-color .2s, background-color .2s, box-shadow .3s, opacity .25s, transform .14s var(--ease-out);
}
@media (hover: hover) {
  .opt:hover { background: var(--surface-2); border-color: var(--line-strong); }
}
.opt:active { transform: scale(.982); }
.opt:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.opt[aria-checked="true"] {
  border-color: var(--saffron-line);
  background: linear-gradient(var(--saffron-soft), var(--saffron-soft)), var(--surface);
  box-shadow: inset 0 0 0 1px var(--saffron-line), 0 14px 32px -18px rgba(239, 192, 77, .5);
}
.opts.committing .opt:not([aria-checked="true"]) { opacity: .4; }

.opt-key {
  width: 30px; height: 30px;
  border-radius: var(--r-tile);
  display: grid; place-items: center;
  font: 800 13px/1 var(--f);
  color: var(--muted);
  background: var(--charcoal);
  border: 1px solid var(--line);
  transition: background .2s, color .2s, border-color .2s;
}
.opt[aria-checked="true"] .opt-key { background: var(--saffron); border-color: var(--saffron); color: var(--charcoal); }
.opt-text { font-size: 16px; line-height: 1.38; color: var(--porcelain); font-weight: 450; text-wrap: pretty; }
.opt-text strong { font-weight: 700; }
.opt-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  box-sizing: border-box;
  display: grid; place-items: center;
  color: var(--charcoal);
  transition: background .2s, border-color .2s;
}
.opt-check path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .3s .06s var(--ease-out); }
.opt[aria-checked="true"] .opt-check { background: var(--saffron); border-color: var(--saffron); animation: pop .38s var(--ease-out); }
.opt[aria-checked="true"] .opt-check path { stroke-dashoffset: 0; }
@keyframes pop { 0% { transform: scale(.55); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }

/* ───────────── Email ───────────── */
.email .h2 { margin-top: 12px; }
.form { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
.field-label { font-weight: 700; font-size: 14px; color: var(--porcelain); }
.input {
  box-sizing: border-box;
  width: 100%; height: 58px;
  padding: 0 16px;
  border-radius: var(--r-card);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--porcelain);
  font: 500 17px/1 var(--f);     /* ≥16px stops iOS zooming on focus */
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.input::placeholder { color: var(--faint); }
.input:focus { border-color: var(--saffron); box-shadow: 0 0 0 4px rgba(239, 192, 77, .16); }
.input[aria-invalid="true"] { border-color: var(--error); box-shadow: 0 0 0 4px rgba(255, 122, 107, .14); }
.field-msg { margin: 0; min-height: 20px; font-size: 14px; color: var(--error); }
.suggest {
  all: unset; cursor: pointer;
  font-size: 14px; color: var(--muted);
  border-radius: 6px;
}
.suggest b { color: var(--saffron); font-weight: 700; }
.suggest:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.form .btn { margin-top: 6px; }
.reassure {
  margin: 14px 0 0;
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 13.5px; line-height: 1.45;
  color: var(--muted);
}
.reassure svg { flex: none; margin-top: 2px; color: var(--saffron); }
.reassure a { color: var(--porcelain); text-underline-offset: 3px; }
.shake { animation: shake .36s var(--ease-out); }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

/* ───────────── Processing ───────────── */
.centered { align-items: center; text-align: center; }
.mark-loader { width: 112px; margin: 9vh auto 30px; }
.mark-loader svg { width: 100%; height: auto; overflow: visible; display: block; }
.mark-loader path {
  fill: var(--saffron);
  fill-opacity: 0;
  stroke: var(--saffron);
  stroke-width: 2.2;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
}
.mark-loader.run path { animation: draw 1.4s var(--ease-out) forwards, fillin .5s 1.25s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fillin { to { fill-opacity: 1; } }
.steps {
  list-style: none; margin: 26px auto 0; padding: 0;
  display: flex; flex-direction: column; gap: 14px;
  text-align: left;
}
.steps li { display: flex; align-items: center; gap: 12px; font-size: 15.5px; color: var(--faint); transition: color .3s; }
.step-dot {
  flex: none; width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  box-sizing: border-box;
  display: grid; place-items: center;
  color: var(--charcoal);
  transition: background .25s, border-color .25s;
}
.step-dot svg { opacity: 0; transition: opacity .2s; }
.steps li.active, .steps li.done { color: var(--porcelain); }
.steps li.active .step-dot { border-color: var(--saffron); border-top-color: transparent; animation: spin .7s linear infinite; }
.steps li.done .step-dot { background: var(--saffron); border-color: var(--saffron); animation: pop .35s var(--ease-out); }
.steps li.done .step-dot svg { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ───────────── Result preview (handoff) ───────────── */
.profile-name {
  margin: 14px 0 0;
  font: 800 clamp(48px, 15vw, 76px)/1 var(--f);
  letter-spacing: .04em;
  font-style: normal;
  color: var(--saffron);
}
.scores { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
.score-row { display: grid; grid-template-columns: 5.6em 1fr 2.4em; align-items: center; gap: 12px; font: 700 13px/1 var(--f); letter-spacing: .1em; }
.score-row .name { color: var(--muted); }
.score-row .pts { text-align: right; font-variant-numeric: tabular-nums; letter-spacing: 0; color: var(--muted); }
.score-row.top .name, .score-row.top .pts { color: var(--porcelain); }
.track { height: 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--faint); transform-origin: left; animation: grow .9s .25s var(--ease-out) backwards; }
.score-row.top .track i { background: var(--saffron); }
@keyframes grow { from { transform: scaleX(0); } }
.handoff { margin-top: 28px; border: 1px solid var(--line); border-radius: var(--r-card); background: rgba(15, 17, 18, .7); }
.handoff summary { cursor: pointer; padding: 14px 16px; font: 700 12px/1.2 var(--f); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.handoff summary:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; border-radius: var(--r-card); }
.handoff pre { margin: 0; padding: 0 16px 16px; overflow-x: auto; font: 500 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.note { margin: 12px 0 0; text-align: center; font-size: 13.5px; color: var(--muted); }
.note code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--porcelain); }

/* ───────────── Larger screens ───────────── */
@media (min-width: 720px) and (min-height: 700px) {
  .screen { justify-content: center; padding-block: 24px 56px; }
  .dock { position: static; margin-top: 30px; padding-block: 0; background: none; }
  .mark-loader { margin-top: 0; }
  .wordmark { width: 170px; }
}

@media (min-width: 720px) {
  /* Wide screens: the photo shows edge to edge, with a darker column behind the centred text */
  body[data-screen="intro"] .photo::after {
    background:
      linear-gradient(90deg, rgba(5, 5, 5, .35) 0%, rgba(5, 5, 5, .82) 32%, rgba(5, 5, 5, .86) 50%, rgba(5, 5, 5, .82) 68%, rgba(5, 5, 5, .35) 100%),
      linear-gradient(180deg, rgba(5, 5, 5, .5), transparent 30%, transparent 70%, #050505);
  }
  .photo img { object-position: 50% 45%; }
}

@media (prefers-reduced-motion: reduce) {
  .seg.now::after, .steps li.active .step-dot { animation: none; }
  .opt[aria-checked="true"] .opt-check, .steps li.done .step-dot, .track i, .shake { animation: none; }
  .mark-loader path { stroke-dashoffset: 0; fill-opacity: 1; }
  .mark-loader.run path { animation: none; }
}
</style>
<style id="figma-freeze">
*, *::before, *::after { animation: none !important; transition: none !important; }
.mark-loader path { stroke-dashoffset: 0 !important; fill-opacity: 1 !important; }
</style>
</head>
<body data-screen="q" style="--photo-focus: 68% 50%; --heat: 0.625;">
<div class="photo ready" id="photo" aria-hidden="true"><img id="photo-img" alt="" decoding="async" src="../assets/allenamento.jpg"></div>
