<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Oltresoglia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<style>
/* ───────────── Oltresoglia tokens ─────────────
   Brand colours come from "Source Files – Oltresoglia" (Figma):
   Dark Charcoal #050505 · Saffron Mango #EFC04D · Porcelain #EBF0F2 · BlackOut #000 · WhiteOut #FFF.
   Typeface: Manrope. The funnel commits to the Dark Charcoal variant of the brand. */
:root {
  color-scheme: dark;
  --charcoal: #050505;        /* ground */
  --surface: #0F1112;         /* cards — charcoal lifted, cool bias toward Porcelain */
  --surface-2: #171A1C;       /* hover */
  --line: rgba(235, 240, 242, .10);
  --line-strong: rgba(235, 240, 242, .22);
  --porcelain: #EBF0F2;       /* text */
  --muted: #9CA3A7;           /* Porcelain at reading-grey */
  --faint: #697075;
  --saffron: #EFC04D;         /* accent */
  --saffron-hi: #F5CF6E;
  --saffron-soft: rgba(239, 192, 77, .09);
  --saffron-line: rgba(239, 192, 77, .62);
  --error: #FF7A6B;

  --r-card: 12px;
  --r-btn: 12px;
  --r-tile: 8px;
  --slant: -10deg;            /* forward lean of the wordmark and icon */
  --shadow: inset 0 1px 0 rgba(235, 240, 242, .04), 0 12px 30px -16px rgba(0, 0, 0, .9);
  --ease-out: cubic-bezier(.2, .8, .2, 1);

  --f: "Manrope", "Helvetica Neue", Arial, sans-serif;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--charcoal);
  color: var(--porcelain);
  font: 450 16px/1.5 var(--f);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* Faint saffron light at the top that grows with progress */
body::before {
  content: "";
  position: fixed;
  left: 50%; top: -42vh;
  width: 130vmax; height: 80vh;
  translate: -50% 0;
  background: radial-gradient(closest-side, rgba(239, 192, 77, .16), rgba(239, 192, 77, .04) 55%, transparent 75%);
  opacity: calc(.2 + var(--heat, 0) * .8);
  transition: opacity 1.2s var(--ease-out);
  pointer-events: none;
  z-index: 1;
}

/* ───────────── Background photo ─────────────
   Full-bleed training photo behind every screen. Shown in black and white so Saffron stays the only colour,
   under a Charcoal gradient that deepens toward the bottom, where answers and buttons sit.
   Strength changes per screen: strongest on the entry screen, quiet behind the questions. */
.photo {
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .9s var(--ease-out);
}
.photo.ready { opacity: var(--photo-strength, .9); }
.photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: var(--photo-focus, 50% 30%);
  filter: grayscale(1) contrast(1.12) brightness(.92);
}
.photo::after {
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(5, 5, 5, .72) 0%, rgba(5, 5, 5, .58) 18%, rgba(5, 5, 5, .7) 34%, rgba(5, 5, 5, .86) 55%, #050505 84%),
    radial-gradient(130% 90% at 50% 25%, transparent 40%, rgba(5, 5, 5, .7));
}
body[data-screen="intro"]      { --photo-strength: .95; }
body[data-screen="q"],
body[data-screen="email"]      { --photo-strength: .38; }
body[data-screen="processing"] { --photo-strength: .55; }
body[data-screen="result"]     { --photo-strength: .7; }
@media (min-width: 720px) {
  .photo::after {
    background:
      linear-gradient(180deg, rgba(5, 5, 5, .55), rgba(5, 5, 5, .72) 60%, rgba(5, 5, 5, .9)),
      radial-gradient(60% 90% at 50% 45%, rgba(5, 5, 5, .55), transparent 90%);
  }
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ───────────── Shell ───────────── */
.app {
  position: relative; z-index: 2;
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 20px;
  box-sizing: border-box;
  display: flex; flex-direction: column;
}
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 3;
  height: 64px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 14px;
}
.bar[data-mode="brand"] { display: flex; justify-content: space-between; }
.bar[data-mode="brand"] .back,
.bar[data-mode="brand"] .progress,
.bar[data-mode="brand"] .count { display: none; }
.bar[data-mode="progress"] .wordmark { display: none; }
.bar.no-back .back { visibility: hidden; }

.wordmark { width: 148px; height: auto; color: var(--porcelain); display: block; }

.back {
  all: unset; box-sizing: border-box;
  width: 44px; height: 44px; margin-left: -10px;
  border-radius: 10px;
  display: grid; place-items: center;
  color: var(--muted);
  cursor: pointer;
  transition: background .2s, color .2s;
}
.back:hover { background: var(--surface); color: var(--porcelain); }
.back:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }

/* Progress: one slanted segment per question, leaning like the wordmark */
.progress { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; padding-inline: 2px; }
.seg {
  position: relative;
  height: 5px;
  transform: skewX(var(--slant));
  border-radius: 1.5px;
  background: var(--line-strong);
  overflow: hidden;
}
.seg::after {
  content: ""; position: absolute; inset: 0;
  background: var(--saffron);
  transform: scaleX(0); transform-origin: left;
  transition: transform .5s var(--ease-out);
}
.seg.done::after { transform: scaleX(1); }
.seg.now::after { transform: scaleX(.4); animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
.count {
  font: 700 13px/1 var(--f);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
}

.stage { flex: 1; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; padding-block: 8px 0; }

/* ───────────── Type ───────────── */
.eyebrow {
  margin: 0;
  font: 700 12px/1.2 var(--f);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--saffron);
}
.eyebrow .dim { color: var(--faint); }
.display, .h2, .q-title {
  margin: 0;
  font-family: var(--f);
  font-weight: 800;
  letter-spacing: -.03em;
  text-wrap: balance;
}
.display { font-size: clamp(34px, 9.4vw, 50px); line-height: 1.04; margin-top: 16px; }
.h2 { font-size: clamp(27px, 7.4vw, 36px); line-height: 1.1; }
.q-title { font-size: clamp(24px, 6.6vw, 32px); line-height: 1.16; margin-top: 12px; }
h1:focus { outline: none; }
.saffron { color: var(--saffron); }
.lede {
  margin: 14px 0 0;
  max-width: 32em;
  font-size: 17px; line-height: 1.5;
  color: var(--muted);
  text-wrap: pretty;
}
.label {
  margin: 0 0 10px;
  font: 700 11.5px/1 var(--f);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}

/* ───────────── Buttons ───────────── */
.btn {
  all: unset; box-sizing: border-box;
  width: 100%; min-height: 58px; padding: 0 22px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  border-radius: var(--r-btn);
  background: var(--saffron);
  color: var(--charcoal);
  font: 800 17px/1 var(--f);
  letter-spacing: -.01em;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 16px 34px -18px rgba(239, 192, 77, .7);
  transition: background .2s, transform .12s var(--ease-out), opacity .2s;
  user-select: none;
}
.btn .arr { transition: transform .25s var(--ease-out); }
@media (hover: hover) {
  .btn:hover { background: var(--saffron-hi); }
  .btn:hover .arr { transform: translateX(3px); }
}
.btn:active { transform: scale(.975); }
.btn:focus-visible { outline: 2px solid var(--porcelain); outline-offset: 3px; }
.btn[aria-busy="true"] { opacity: .75; pointer-events: none; }

.btn-text {
  all: unset; box-sizing: border-box;
  display: block; margin: 6px auto 0;
  min-height: 44px; padding: 0 14px;
  border-radius: 10px;
  color: var(--muted);
  font: 600 15px/44px var(--f);
  cursor: pointer;
}
.btn-text:hover { color: var(--porcelain); }
.btn-text:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }

.dock {
  position: sticky; bottom: 0; z-index: 2;
  margin-top: auto;
  padding-block: 28px calc(16px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(rgba(5, 5, 5, 0), var(--charcoal) 40%);
}
.meta {
  margin: 14px 0 0;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 6px 10px;
  font: 700 11px/1 var(--f);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--faint);
}
.meta span + span::before { content: "·"; margin-right: 10px; color: var(--line-strong); }
.hint {
  margin: 0; min-height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  text-align: center;
  font-size: 14px;
  color: var(--faint);
}
.kbd { display: none; font: 700 10.5px/1 var(--f); letter-spacing: .12em; text-transform: uppercase; }
@media (hover: hover) and (pointer: fine) { .kbd { display: block; } }

/* ───────────── Entry ───────────── */
.intro .eyebrow { margin-top: 22px; }
.profiles { margin-top: 30px; }
.profile-row {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
}
.profile-row li {
  padding: 14px 4px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  font: 800 12.5px/1 var(--f);
  letter-spacing: .12em;
  color: var(--porcelain);
  background: rgba(15, 17, 18, .7);
}

/* ───────────── Answer cards ───────────── */
.opts { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
.opt {
  all: unset; box-sizing: border-box;
  min-height: 64px;
  padding: 14px 16px 14px 14px;
  display: grid;
  grid-template-columns: 30px 1fr 22px;
  align-items: center;
  gap: 14px;
  border-radius: var(--r-card);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: border-color .2s, background-color .2s, box-shadow .3s, opacity .25s, transform .14s var(--ease-out);
}
@media (hover: hover) {
  .opt:hover { background: var(--surface-2); border-color: var(--line-strong); }
}
.opt:active { transform: scale(.982); }
.opt:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.opt[aria-checked="true"] {
  border-color: var(--saffron-line);
  background: linear-gradient(var(--saffron-soft), var(--saffron-soft)), var(--surface);
  box-shadow: inset 0 0 0 1px var(--saffron-line), 0 14px 32px -18px rgba(239, 192, 77, .5);
}
.opts.committing .opt:not([aria-checked="true"]) { opacity: .4; }

.opt-key {
  width: 30px; height: 30px;
  border-radius: var(--r-tile);
  display: grid; place-items: center;
  font: 800 13px/1 var(--f);
  color: var(--muted);
  background: var(--charcoal);
  border: 1px solid var(--line);
  transition: background .2s, color .2s, border-color .2s;
}
.opt[aria-checked="true"] .opt-key { background: var(--saffron); border-color: var(--saffron); color: var(--charcoal); }
.opt-text { font-size: 16px; line-height: 1.38; color: var(--porcelain); font-weight: 450; text-wrap: pretty; }
.opt-text strong { font-weight: 700; }
.opt-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  box-sizing: border-box;
  display: grid; place-items: center;
  color: var(--charcoal);
  transition: background .2s, border-color .2s;
}
.opt-check path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .3s .06s var(--ease-out); }
.opt[aria-checked="true"] .opt-check { background: var(--saffron); border-color: var(--saffron); animation: pop .38s var(--ease-out); }
.opt[aria-checked="true"] .opt-check path { stroke-dashoffset: 0; }
@keyframes pop { 0% { transform: scale(.55); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }

/* ───────────── Email ───────────── */
.email .h2 { margin-top: 12px; }
.form { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
.field-label { font-weight: 700; font-size: 14px; color: var(--porcelain); }
.input {
  box-sizing: border-box;
  width: 100%; height: 58px;
  padding: 0 16px;
  border-radius: var(--r-card);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--porcelain);
  font: 500 17px/1 var(--f);     /* ≥16px stops iOS zooming on focus */
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.input::placeholder { color: var(--faint); }
.input:focus { border-color: var(--saffron); box-shadow: 0 0 0 4px rgba(239, 192, 77, .16); }
.input[aria-invalid="true"] { border-color: var(--error); box-shadow: 0 0 0 4px rgba(255, 122, 107, .14); }
.field-msg { margin: 0; min-height: 20px; font-size: 14px; color: var(--error); }
.suggest {
  all: unset; cursor: pointer;
  font-size: 14px; color: var(--muted);
  border-radius: 6px;
}
.suggest b { color: var(--saffron); font-weight: 700; }
.suggest:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.form .btn { margin-top: 6px; }
.reassure {
  margin: 14px 0 0;
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 13.5px; line-height: 1.45;
  color: var(--muted);
}
.reassure svg { flex: none; margin-top: 2px; color: var(--saffron); }
.reassure a { color: var(--porcelain); text-underline-offset: 3px; }
.shake { animation: shake .36s var(--ease-out); }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

/* ───────────── Processing ───────────── */
.centered { align-items: center; text-align: center; }
.mark-loader { width: 112px; margin: 9vh auto 30px; }
.mark-loader svg { width: 100%; height: auto; overflow: visible; display: block; }
.mark-loader path {
  fill: var(--saffron);
  fill-opacity: 0;
  stroke: var(--saffron);
  stroke-width: 2.2;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
}
.mark-loader.run path { animation: draw 1.4s var(--ease-out) forwards, fillin .5s 1.25s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fillin { to { fill-opacity: 1; } }
.steps {
  list-style: none; margin: 26px auto 0; padding: 0;
  display: flex; flex-direction: column; gap: 14px;
  text-align: left;
}
.steps li { display: flex; align-items: center; gap: 12px; font-size: 15.5px; color: var(--faint); transition: color .3s; }
.step-dot {
  flex: none; width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  box-sizing: border-box;
  display: grid; place-items: center;
  color: var(--charcoal);
  transition: background .25s, border-color .25s;
}
.step-dot svg { opacity: 0; transition: opacity .2s; }
.steps li.active, .steps li.done { color: var(--porcelain); }
.steps li.active .step-dot { border-color: var(--saffron); border-top-color: transparent; animation: spin .7s linear infinite; }
.steps li.done .step-dot { background: var(--saffron); border-color: var(--saffron); animation: pop .35s var(--ease-out); }
.steps li.done .step-dot svg { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ───────────── Result preview (handoff) ───────────── */
.profile-name {
  margin: 14px 0 0;
  font: 800 clamp(48px, 15vw, 76px)/1 var(--f);
  letter-spacing: .04em;
  font-style: normal;
  color: var(--saffron);
}
.scores { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
.score-row { display: grid; grid-template-columns: 5.6em 1fr 2.4em; align-items: center; gap: 12px; font: 700 13px/1 var(--f); letter-spacing: .1em; }
.score-row .name { color: var(--muted); }
.score-row .pts { text-align: right; font-variant-numeric: tabular-nums; letter-spacing: 0; color: var(--muted); }
.score-row.top .name, .score-row.top .pts { color: var(--porcelain); }
.track { height: 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--faint); transform-origin: left; animation: grow .9s .25s var(--ease-out) backwards; }
.score-row.top .track i { background: var(--saffron); }
@keyframes grow { from { transform: scaleX(0); } }
.handoff { margin-top: 28px; border: 1px solid var(--line); border-radius: var(--r-card); background: rgba(15, 17, 18, .7); }
.handoff summary { cursor: pointer; padding: 14px 16px; font: 700 12px/1.2 var(--f); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.handoff summary:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; border-radius: var(--r-card); }
.handoff pre { margin: 0; padding: 0 16px 16px; overflow-x: auto; font: 500 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.note { margin: 12px 0 0; text-align: center; font-size: 13.5px; color: var(--muted); }
.note code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--porcelain); }

/* ───────────── Larger screens ───────────── */
@media (min-width: 720px) and (min-height: 700px) {
  .screen { justify-content: center; padding-block: 24px 56px; }
  .dock { position: static; margin-top: 30px; padding-block: 0; background: none; }
  .mark-loader { margin-top: 0; }
  .wordmark { width: 170px; }
}

@media (prefers-reduced-motion: reduce) {
  .seg.now::after, .steps li.active .step-dot { animation: none; }
  .opt[aria-checked="true"] .opt-check, .steps li.done .step-dot, .track i, .shake { animation: none; }
  .mark-loader path { stroke-dashoffset: 0; fill-opacity: 1; }
  .mark-loader.run path { animation: none; }
}
</style>
</head>
<body>
<div class="photo" id="photo" aria-hidden="true"><img id="photo-img" alt="" decoding="async"></div>
<div class="app">
  <header class="bar" id="bar" data-mode="brand">

<script>
/* ═══════════════ Configuration ═══════════════ */
const CONFIG = {
  autoAdvanceMs: 380,          // pause after a tap so the choice registers
  processingMs: 2000,          // "Stiamo analizzando…" (keep 1.5–2.5s)
  resultUrl: null,             // e.g. '/risultato/{profile}' — when set, redirects instead of showing the preview
  privacyUrl: '#privacy',      // link to the privacy notice
  backgroundImage: 'assets/allenamento.jpg',   // training photo behind the test (null = no photo)
  backgroundFocus: '50% 30%',  // which part of the photo stays in frame on narrow phones
  storageKey: 'oltresoglia-test:v1',
  /* Replace with the real ESP / CRM call. Runs in parallel with the processing animation. */
  submitLead: async payload => { await new Promise(r => setTimeout(r, 400)); return { ok: true }; }
};

/* ═══════════════ Content — copy and points exactly as in the test brief ═══════════════ */
const TITLE = 'Scopri che tipo di professionista ad alta pressione sei';
const TIE_ORDER = ['AFELIO', 'ORBITA', 'ZENIT', 'ECLISSI'];

const QUESTIONS = [
  { id: 'q1', title: 'Come sono i tuoi orari di lavoro?', options: [
    { text: 'Cambiano da una settimana all’altra: ruoto su fasce diverse o faccio turni', p: 'ORBITA', pts: 8 },
    { text: 'Entro sempre alla stessa ora. L’ora di uscita la decide la giornata', p: 'ZENIT', pts: 6 },
    { text: 'Dipende da dove sono: alcune settimane lavoro fuori sede', p: 'AFELIO', pts: 8 },
    { text: 'Entro ed esco quasi sempre alla stessa ora', p: 'ECLISSI', pts: 6 }
  ]},
  { id: 'q2', title: 'Quante notti al mese passi fuori città per lavoro in albergo, alloggio ecc?', options: [
    { text: 'Nessuna', p: null, pts: 0 },
    { text: 'Una o due', p: 'AFELIO', pts: 3 },
    { text: 'Tre o cinque', p: 'AFELIO', pts: 8 },
    { text: 'Sei o più', p: 'AFELIO', pts: 15 }
  ]},
  { id: 'q3', title: 'Ti capita di lavorare di notte, o di iniziare prima delle sei del mattino?', options: [
    { text: 'Sì, fa parte del mio giro di turni', p: 'ORBITA', pts: 12 },
    { text: 'Ogni tanto, quando serve', p: 'ORBITA', pts: 4 },
    { text: 'Mai', p: null, pts: 0 }
  ]},
  { id: 'q4', title: 'Contando anche mail, messaggi e chiamate fuori orario, il tuo lavoro occupa:', options: [
    { text: 'Otto ore o meno', p: 'ECLISSI', pts: 8 },
    { text: 'Nove o dieci ore', p: 'ZENIT', pts: 10 },
    { text: 'Più di dieci ore', p: 'ZENIT', pts: 13 },
    { text: 'Dipende dal turno che ho quella settimana', p: 'ORBITA', pts: 6 }
  ]},
  { id: 'q5', title: 'Chiudi la giornata di lavoro. Cosa succede subito dopo?', options: [
    { text: 'Non chiude davvero: continuo a rispondere e a pensarci', p: 'ZENIT', pts: 8 },
    { text: 'Comincia il resto: figli da prendere, spesa, casa, un genitore da sentire', p: 'ECLISSI', pts: 13 },
    { text: 'Dipende dal turno: a volte è mattina, a volte è notte', p: 'ORBITA', pts: 6 },
    { text: 'Inizio a pensare alla prossima trasferta', p: 'AFELIO', pts: 8 }
  ]},
  { id: 'q6', title: 'Qual è il momento in cui il tuo piano salta più spesso?', options: [
    { text: 'Il giorno in cui cambia il turno', p: 'ORBITA', pts: 4 },
    { text: 'La sera in cui esco più tardi del previsto', p: 'ZENIT', pts: 4 },
    { text: 'I giorni in cui dormo fuori casa', p: 'AFELIO', pts: 4 },
    { text: 'Nessuno in particolare: non salta di colpo, si consuma un pezzo alla volta', p: 'ECLISSI', pts: 4 }
  ]},
  { id: 'q7', title: 'Qual è il pasto più difficile della tua settimana?', options: [
    { text: 'Quello del turno di notte, che non so nemmeno come chiamare', p: 'ORBITA', pts: 4 },
    { text: 'La cena tardi, dopo un pranzo saltato o mangiato in dieci minuti', p: 'ZENIT', pts: 4 },
    { text: 'Il buffet dell’hotel, l’autogrill, la cena con il cliente', p: 'AFELIO', pts: 4 },
    { text: 'Quello che mangio in piedi, mentre preparo per gli altri', p: 'ECLISSI', pts: 4 }
  ]},
  { id: 'q8', title: 'Quale di queste frasi ti sei detto più spesso?', options: [
    { text: '«Con i miei orari è impossibile»', p: 'ORBITA', pts: 5 },
    { text: '«Da lunedì mi organizzo»', p: 'ZENIT', pts: 5 },
    { text: '«Quando torno riprendo»', p: 'AFELIO', pts: 5 },
    { text: '«In teoria il tempo ce l’avrei»', p: 'ECLISSI', pts: 5 }
  ]}
];

const STEPS = ['Incrocio orari, turni e trasferte', 'Calcolo quanto pesa davvero la tua giornata', 'Individuo il tuo profilo'];

/* Common address typos → suggested fix */
const DOMAIN_FIX = {
  'gmial.com': 'gmail.com', 'gmai.com': 'gmail.com', 'gnail.com': 'gmail.com', 'gmail.co': 'gmail.com',
  'gmail.con': 'gmail.com', 'gmail.cm': 'gmail.com', 'hotmial.com': 'hotmail.com', 'hotmail.con': 'hotmail.com',
  'hotmai.it': 'hotmail.it', 'libero.ti': 'libero.it', 'libreo.it': 'libero.it', 'yaho.com': 'yahoo.com',
  'yahoo.con': 'yahoo.com', 'yaho.it': 'yahoo.it', 'outlok.com': 'outlook.com', 'outlook.con': 'outlook.com',
  'icloud.co': 'icloud.com', 'icloud.con': 'icloud.com', 'virgilio.ti': 'virgilio.it', 'alice.ti': 'alice.it'
};

/* ═══════════════ Icons ═══════════════ */
const ICON = {
  arrow: '<svg class="arr" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check: '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  mark: '<svg viewBox="-2 -2 153.15 120.47" aria-hidden="true"><path pathLength="1" d="M119.84 52.17L113.46 88.41C113 90.61 111.81 92.54 109.93 94.14C107.94 95.85 105.72 96.69 103.34 96.69L35.51 96.69C32.94 96.69 30.67 95.63 28.98 93.64C27.36 91.69 26.76 89.29 27.19 86.7L37.46 28.37C37.89 26.05 39.1 24 41.07 22.31C43.06 20.65 45.29 19.78 47.67 19.78L92.66 19.78C104.48 19.78 114.8 13.21 119.55 2.59L120.72 0L37.98 0C32.47 0 27.25 2.03 22.52 6.08C17.76 10.14 14.87 14.98 13.89 20.52L0.34 97.32C-0.61 102.68 0.45 107.11 3.56 110.89C6.59 114.59 10.78 116.47 16.03 116.47L113.02 116.47C118.54 116.47 123.75 114.42 128.48 110.4C133.15 106.44 136.05 101.68 137.07 96.26L149.15 27.67L146.8 27.85C133.28 28.82 122.19 38.83 119.84 52.21L119.84 52.17Z"/></svg>'
};

/* ═══════════════ State ═══════════════ */
const N = QUESTIONS.length;
const state = { screen: 'intro', index: 0, answers: {}, email: '', startedAt: null, result: null };
const $ = (sel, root = document) => root.querySelector(sel);
const stage = $('#stage'), bar = $('#bar'), count = $('#count'), live = $('#live'), progress = $('#progress');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
let busy = false, advanceTimer = null, shownAt = 0;
let histDepth = 0, awaitingPop = false, popFallback = null;

progress.innerHTML = QUESTIONS.map(() => '<span class="seg"></span>').join('');
const segs = [...progress.children];

const store = {
  load() { try { return JSON.parse(localStorage.getItem(CONFIG.storageKey)); } catch (e) { return null; } },
  save() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify({ answers: state.answers, startedAt: state.startedAt })); } catch (e) {} },
  clear() { try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {} }
};
function track(event, data = {}) {
  try { (window.dataLayer = window.dataLayer || []).push({ event: 'oltresoglia_test_' + event, ...data }); } catch (e) {}
}
const answered = () => QUESTIONS.filter(q => state.answers[q.id] != null).length;
const firstUnanswered = () => { const i = QUESTIONS.findIndex(q => state.answers[q.id] == null); return i < 0 ? N - 1 : i; };

/* ═══════════════ Scoring ═══════════════
   Totals are recomputed from the final answers, so going back and changing an answer is always safe. */
function computeResult() {
  const scores = Object.fromEntries(TIE_ORDER.map(p => [p, 0]));
  QUESTIONS.forEach(q => {
    const o = q.options[state.answers[q.id]];
    if (o && o.p) scores[o.p] += o.pts;
  });
  const max = Math.max(...Object.values(scores));
  const profile = TIE_ORDER.find(p => scores[p] === max);   // tie → AFELIO › ORBITA › ZENIT › ECLISSI
  const tied = TIE_ORDER.filter(p => scores[p] === max);
  return { profile, scores, tieBrokenFrom: tied.length > 1 ? tied : null };
}

/* ═══════════════ Screens ═══════════════ */
/* Bold the first clause of an answer (up to ":" or ".") so long answers scan faster. Wording is unchanged. */
function emphasize(t) {
  const m = t.match(/^(.{6,60}?[:.])\s(.+)$/);
  return m ? `<strong>${m[1]}</strong> ${m[2]}` : t;
}

function introHTML() {
  const resuming = answered() > 0;
  return `<section class="screen intro">
    <p class="eyebrow" data-stagger>8 domande · 60–90 secondi</p>
    <h1 class="display" tabindex="-1" data-stagger>${TITLE.replace('ad alta pressione', '<span class="saffron">ad alta pressione</span>')}</h1>
    <p class="lede" data-stagger>Otto domande sulla tua settimana vera: orari, trasferte, serate, pasti.</p>
    <div class="profiles" data-stagger>
      <p class="label">Quale dei quattro sei?</p>
      <ul class="profile-row">${['ORBITA', 'ZENIT', 'AFELIO', 'ECLISSI'].map(p => `<li>${p}</li>`).join('')}</ul>
    </div>
    <div class="dock">
      ${resuming
        ? `<button class="btn" id="resume" type="button">Riprendi dalla domanda ${firstUnanswered() + 1} ${ICON.arrow}</button>
           <button class="btn-text" id="fresh" type="button">Ricomincia da capo</button>`
        : `<button class="btn" id="start" type="button">Inizia il test ${ICON.arrow}</button>`}
      <p class="meta"><span>Risultato immediato</span><span>Nessuna app</span></p>
    </div>
  </section>`;
}

function questionHTML(i) {
  const q = QUESTIONS[i];
  const sel = state.answers[q.id];
  const focusIdx = sel ?? 0;
  return `<section class="screen question">
    <p class="eyebrow" data-stagger>Domanda ${i + 1} <span class="dim">di ${N}</span></p>
    <h1 class="q-title" id="q-title" tabindex="-1" data-stagger>${q.title}</h1>
    <div class="opts" role="radiogroup" aria-labelledby="q-title">
      ${q.options.map((o, k) => `<button type="button" class="opt" role="radio" id="${q.id}-${k}" data-k="${k}"
          aria-checked="${sel === k}" tabindex="${focusIdx === k ? 0 : -1}" data-stagger>
        <span class="opt-key" aria-hidden="true">${'ABCD'[k]}</span>
        <span class="opt-text">${emphasize(o.text)}</span>
        <span class="opt-check" aria-hidden="true">${ICON.check}</span>
      </button>`).join('')}
    </div>
    <div class="dock">
      ${sel != null
        ? `<button class="btn" id="next" type="button">${i === N - 1 ? 'Continua' : 'Avanti'} ${ICON.arrow}</button>`
        : `<p class="hint">${i === 0 ? 'Tocca una risposta per andare avanti' : 'Scegli quella più vicina alla tua settimana'}<span class="kbd">Tasti ${'ABCD'.slice(0, q.options.length).split('').join(' ')}</span></p>`}
    </div>
  </section>`;
}

function emailHTML() {
  return `<section class="screen email">
    <p class="eyebrow" data-stagger>Ultimo passo</p>
    <h1 class="h2" tabindex="-1" data-stagger>Il tuo profilo è pronto. Dove te lo mandiamo?</h1>
    <p class="lede" data-stagger>Lo vedi subito nella pagina successiva. Via email ti arriva anche la guida pensata per il tuo profilo, da rileggere con calma.</p>
    <form class="form" id="email-form" novalidate data-stagger>
      <label class="field-label" for="email">La tua email</label>
      <input class="input" id="email" name="email" type="email" inputmode="email" autocomplete="email"
             autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="nome@email.it"
             aria-describedby="email-msg" value="${state.email.replace(/"/g, '&quot;')}">
      <p class="field-msg" id="email-msg" aria-live="polite"></p>
      <button class="btn" id="email-submit" type="submit">Mostrami il risultato ${ICON.arrow}</button>
      <p class="reassure">${ICON.lock}<span>Usiamo la tua email solo per il risultato e la guida. Niente spam: ti cancelli con un clic. <a href="${CONFIG.privacyUrl}">Informativa privacy</a></span></p>
    </form>
  </section>`;
}

function processingHTML() {
  return `<section class="screen processing centered" aria-busy="true">
    <div class="mark-loader" data-stagger>${ICON.mark}</div>
    <h1 class="h2" tabindex="-1" data-stagger>Stiamo analizzando le tue risposte…</h1>
    <ul class="steps">${STEPS.map(s => `<li data-stagger><span class="step-dot">${ICON.check}</span>${s}</li>`).join('')}</ul>
  </section>`;
}

function resultHTML(r) {
  const max = Math.max(...Object.values(r.scores)) || 1;
  const rows = TIE_ORDER.map(p => [p, r.scores[p]]).sort((a, b) => b[1] - a[1]);
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return `<section class="screen result">
    <p class="eyebrow" data-stagger>Il tuo profilo</p>
    <h1 class="profile-name" tabindex="-1" data-stagger>${r.profile}</h1>
    <div class="scores" data-stagger>
      <p class="label">Punteggio per profilo</p>
      ${rows.map(([p, v]) => `<div class="score-row${p === r.profile ? ' top' : ''}">
        <span class="name">${p}</span>
        <span class="track"><i style="width:${(v / max) * 100}%"></i></span>
        <span class="pts">${v}</span>
      </div>`).join('')}
    </div>
    <details class="handoff" data-stagger>
      <summary>Dati passati alla pagina risultato</summary>
      <pre>${esc(JSON.stringify(r.payload, null, 2))}</pre>
    </details>
    <div class="dock">
      <button class="btn" id="to-result" type="button">Vedi il tuo risultato ${ICON.arrow}</button>
      <p class="note" id="note" hidden>Prototipo: in produzione si apre <code>/risultato/${r.profile.toLowerCase()}</code> (guida → video → WhatsApp).</p>
      <button class="btn-text" id="restart" type="button">Rifai il test</button>
    </div>
  </section>`;
}

function render() {
  switch (state.screen) {
    case 'intro': return introHTML();
    case 'q': return questionHTML(state.index);
    case 'email': return emailHTML();
    case 'processing': return processingHTML();
    case 'result': return resultHTML(state.result);
  }
}

/* ═══════════════ Chrome ═══════════════ */
function updateBar() {
  const s = state.screen;
  bar.dataset.mode = (s === 'intro' || s === 'result') ? 'brand' : 'progress';
  bar.classList.toggle('no-back', !(s === 'q' || s === 'email'));
  const done = s === 'q' ? state.index : N;
  segs.forEach((el, i) => {
    el.classList.toggle('done', i < done);
    el.classList.toggle('now', s === 'q' && i === state.index);
  });
  progress.setAttribute('aria-valuenow', done);
  count.textContent = s === 'q' ? `${state.index + 1}/${N}` : `${N}/${N}`;
  document.body.style.setProperty('--heat', (done / N).toFixed(3));
  document.body.dataset.screen = s;
}

async function swap(html, dir, animate) {
  const old = stage.firstElementChild;
  const can = animate && typeof stage.animate === 'function';
  const dx = reduced ? 0 : 28;
  if (old && can) {
    try {
      await old.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-dir * dx * .6}px)` }],
        { duration: reduced ? 120 : 170, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }).finished;
    } catch (e) {}
  }
  stage.innerHTML = html;
  window.scrollTo(0, 0);
  const el = stage.firstElementChild;
  if (!can) return;
  el.animate([{ opacity: 0, transform: `translateX(${dir * dx}px)` }, { opacity: 1, transform: 'none' }],
    { duration: reduced ? 160 : 380, easing: 'cubic-bezier(.2,.8,.2,1)' });
  if (!reduced) {
    el.querySelectorAll('[data-stagger]').forEach((n, i) => n.animate(
      [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }],
      { duration: 380, delay: 50 + i * 45, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
  }
}

async function show(screen, index, dir, animate = true) {
  if (busy) return;
  busy = true;
  clearTimeout(advanceTimer);
  state.screen = screen;
  state.index = index;
  if (dir > 0 && (screen === 'q' || screen === 'email')) pushHistory();
  updateBar();
  await swap(render(), dir, animate);
  busy = false;
  shownAt = performance.now();

  if (screen === 'email' && finePointer) $('#email', stage).focus();   // no auto-keyboard on phones
  else if (animate) $('h1', stage)?.focus({ preventScroll: true });

  if (screen === 'q') {
    live.textContent = `Domanda ${index + 1} di ${N}`;
    track('question_view', { question: QUESTIONS[index].id, step: index + 1 });
  } else if (screen === 'email') {
    live.textContent = 'Ultimo passo: inserisci la tua email';
    track('email_view');
  } else if (screen === 'processing') {
    live.textContent = 'Stiamo analizzando le tue risposte';
  } else if (screen === 'result') {
    live.textContent = `Il tuo profilo: ${state.result.profile}`;
  }
}

/* ═══════════════ Flow ═══════════════ */
function start(fresh) {
  if (fresh) { state.answers = {}; state.startedAt = null; store.clear(); }
  state.startedAt = state.startedAt || Date.now();
  track(fresh ? 'start' : 'resume');
  show('q', fresh ? 0 : firstUnanswered(), 1);
}

function select(k) {
  if (busy || state.screen !== 'q') return;
  const q = QUESTIONS[state.index];
  if (k >= q.options.length) return;
  state.answers[q.id] = k;
  store.save();
  const opts = $('.opts', stage);
  opts.classList.add('committing');
  opts.querySelectorAll('.opt').forEach((b, j) => { b.setAttribute('aria-checked', j === k); b.tabIndex = j === k ? 0 : -1; });
  try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
  track('answer', { question: q.id, step: state.index + 1, answer: k + 1, ms: Math.round(performance.now() - shownAt) });
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(next, reduced ? 220 : CONFIG.autoAdvanceMs);
}

function next() {
  clearTimeout(advanceTimer);
  if (state.screen !== 'q' || state.answers[QUESTIONS[state.index].id] == null) return;
  if (state.index === N - 1) return show('email', state.index, 1);
  show('q', state.index + 1, 1);
}

function goBack() {
  if (busy) { setTimeout(goBack, 120); return; }
  clearTimeout(advanceTimer);
  if (state.screen === 'q') {
    track('back', { from: state.index + 1 });
    return state.index === 0 ? show('intro', 0, -1) : show('q', state.index - 1, -1);
  }
  if (state.screen === 'email') return show('q', N - 1, -1);
}

/* Email */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function suggestFor(v) {
  const [user, domain] = v.toLowerCase().split('@');
  return domain && DOMAIN_FIX[domain] ? `${user}@${DOMAIN_FIX[domain]}` : null;
}
function setFieldMsg(kind, text, suggestion) {
  const input = $('#email', stage), msg = $('#email-msg', stage);
  input.setAttribute('aria-invalid', kind === 'error');
  msg.style.color = kind === 'error' ? 'var(--error)' : 'var(--muted)';
  msg.innerHTML = suggestion
    ? `<button type="button" class="suggest" id="apply-suggest" data-v="${suggestion}">Intendevi <b>${suggestion}</b>?</button>`
    : text;
}
async function submitEmail() {
  const input = $('#email', stage);
  const v = input.value.trim();
  state.email = v;
  if (!v || !EMAIL_RE.test(v)) {
    setFieldMsg('error', v ? 'Questa email non sembra completa. Controlla, ad esempio: nome@email.it' : 'Inserisci la tua email per vedere il risultato.');
    const form = $('#email-form', stage);
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    input.focus();
    track('email_error', { reason: v ? 'invalid' : 'empty' });
    return;
  }
  const btn = $('#email-submit', stage);
  btn.setAttribute('aria-busy', 'true');
  input.blur();                                           // close the phone keyboard before the transition
  state.result = computeResult();
  track('email_submit', { profile: state.result.profile });
  const lead = CONFIG.submitLead(buildPayload()).catch(() => ({ ok: false }));
  await show('processing', state.index, 1);
  runProcessing(lead);
}

function buildPayload() {
  return {
    email: state.email,
    profile: state.result.profile,
    scores: state.result.scores,
    tieBrokenFrom: state.result.tieBrokenFrom,
    answers: Object.fromEntries(QUESTIONS.map(q => [q.id, (state.answers[q.id] ?? -1) + 1])),
    durationSec: state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : null
  };
}

function runProcessing(lead) {
  const D = reduced ? 1200 : CONFIG.processingMs;
  const loader = $('.mark-loader', stage);
  requestAnimationFrame(() => loader.classList.add('run'));
  const items = [...stage.querySelectorAll('.steps li')];
  const marks = [.3, .62, .92];
  const t0 = performance.now();
  const timer = new Promise(resolve => {
    (function tick(now) {
      const t = Math.min(1, (now - t0) / D);
      items.forEach((li, i) => {
        const done = t >= marks[i];
        li.classList.toggle('done', done);
        li.classList.toggle('active', !done && (i === 0 || t >= marks[i - 1]));
      });
      if (t < 1) requestAnimationFrame(tick); else setTimeout(resolve, 300);
    })(t0);
  });
  Promise.all([timer, lead]).then(finish);
}

function finish() {
  const payload = buildPayload();
  track('complete', { profile: payload.profile, durationSec: payload.durationSec });
  store.clear();
  window.dispatchEvent(new CustomEvent('oltresoglia:complete', { detail: payload }));
  if (CONFIG.resultUrl) { location.assign(CONFIG.resultUrl.replace('{profile}', payload.profile.toLowerCase())); return; }
  state.result = { ...state.result, payload };
  show('result', state.index, 1);
}

function restart() {
  state.answers = {}; state.startedAt = null; state.result = null;
  store.clear();
  show('intro', 0, -1);
}

/* Hardware / browser back steps through the test instead of leaving it */
function pushHistory() { try { history.pushState({ oltresoglia: true }, ''); histDepth++; } catch (e) {} }
window.addEventListener('popstate', () => {
  if (histDepth > 0) histDepth--;
  if (awaitingPop) { awaitingPop = false; clearTimeout(popFallback); }
  goBack();
});
function onBack() {
  if (histDepth > 0) {
    awaitingPop = true;
    popFallback = setTimeout(() => { if (awaitingPop) { awaitingPop = false; histDepth = 0; goBack(); } }, 300);
    try { history.back(); } catch (e) { awaitingPop = false; clearTimeout(popFallback); goBack(); }
  } else goBack();
}

/* ═══════════════ Events ═══════════════ */
$('#back').addEventListener('click', onBack);

stage.addEventListener('click', e => {
  const opt = e.target.closest('.opt');
  if (opt) return select(+opt.dataset.k);
  const btn = e.target.closest('button');
  if (!btn) return;
  switch (btn.id) {
    case 'start': case 'fresh': return start(true);
    case 'resume': return start(false);
    case 'next': return next();
    case 'restart': return restart();
    case 'to-result': $('#note', stage).hidden = false; return;
    case 'apply-suggest': {
      const input = $('#email', stage);
      input.value = btn.dataset.v; state.email = btn.dataset.v;
      setFieldMsg('ok', ''); input.focus();
      return;
    }
  }
});

stage.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'email-form') submitEmail(); });
stage.addEventListener('input', e => {
  if (e.target.id !== 'email') return;
  if (e.target.getAttribute('aria-invalid') === 'true') setFieldMsg('ok', '');
});
stage.addEventListener('focusout', e => {
  if (e.target.id !== 'email') return;
  const s = suggestFor(e.target.value.trim());
  if (s) setFieldMsg('ok', '', s);
});

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || busy) return;
  const s = state.screen;
  const inField = e.target.matches?.('input, textarea');
  const onControl = e.target.closest?.('button, summary, a, input');
  if (s === 'q') {
    const k = { 1: 0, 2: 1, 3: 2, 4: 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()];
    if (k != null) { e.preventDefault(); select(k); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const opts = [...stage.querySelectorAll('.opt')];
      const cur = opts.indexOf(document.activeElement);
      const to = cur < 0 ? 0 : (cur + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
      opts.forEach((o, j) => { o.tabIndex = j === to ? 0 : -1; });
      opts[to].focus(); e.preventDefault(); return;
    }
  }
  if ((s === 'q' || (s === 'email' && !inField)) && (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'ArrowLeft')) {
    e.preventDefault(); onBack(); return;
  }
  if (e.key === 'Enter' && !onControl) {
    if (s === 'intro') $('#resume, #start', stage)?.click();
    else if (s === 'q') next();
  }
});

/* ═══════════════ Boot ═══════════════ */
if (CONFIG.backgroundImage) {
  const photo = $('#photo'), img = $('#photo-img');
  document.body.style.setProperty('--photo-focus', CONFIG.backgroundFocus);
  img.onload = () => photo.classList.add('ready');   // fades in only once loaded; a missing file leaves the plain Charcoal ground
  img.src = CONFIG.backgroundImage;
}
const saved = store.load();
if (saved && saved.answers) { state.answers = saved.answers; state.startedAt = saved.startedAt || null; }
show('intro', 0, 1, false);
</script>
</body>
</html>
