<!--
  "Snapshots of What I've Been Up To": auto-playing slideshow + lightbox
  Squarespace 7.1: paste everything into one Code Block (Display Source: off).
  Only edit the SETTINGS and PHOTOS below.
-->
<div class="ybss" data-ybss>
  <div class="ybss__frame">
    <div class="ybss__slides"></div>
    <button type="button" class="ybss__arrow ybss__arrow--prev" aria-label="Previous photo">&#8592;</button>
    <button type="button" class="ybss__arrow ybss__arrow--next" aria-label="Next photo">&#8594;</button>
  </div>
  <div class="ybss__bar">
    <span class="ybss__count" aria-hidden="true"></span>
    <button type="button" class="ybss__play" aria-label="Pause slideshow"><span aria-hidden="true">Pause</span></button>
  </div>
</div>

<style>
.ybss{--ybss-ratio:4/5;position:relative;width:100%;color:inherit;font:inherit}
.ybss__frame{position:relative;aspect-ratio:var(--ybss-ratio);overflow:hidden;background:rgba(127,127,127,.12);touch-action:pan-y}
.ybss__slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .8s ease;cursor:zoom-in}
.ybss__slide.is-on{opacity:1;z-index:1}
.ybss__slide img{width:100%;height:100%;object-fit:cover;display:block}
.ybss__arrow{position:absolute;top:50%;z-index:2;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:0;
  background:rgba(255,255,255,.88);color:#111;font-size:18px;line-height:44px;text-align:center;padding:0;cursor:pointer;opacity:0;transition:opacity .3s}
.ybss__arrow--prev{left:12px}.ybss__arrow--next{right:12px}
.ybss:hover .ybss__arrow,.ybss__arrow:focus-visible{opacity:1}
@media (hover:none){.ybss__arrow{opacity:1;width:38px;height:38px;line-height:38px}}
.ybss__bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ybss__count{opacity:.7;font-variant-numeric:tabular-nums}
.ybss__play{background:none;border:0;border-bottom:1px solid currentColor;padding:2px 0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.ybss button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
/* lightbox */
.ybss-lb{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;background:rgba(12,10,9,.94);touch-action:pan-y}
.ybss-lb.is-open{display:flex}
.ybss-lb__img{max-width:calc(100vw - 160px);max-height:calc(100vh - 120px);object-fit:contain;display:block;user-select:none}
.ybss-lb button{position:absolute;border:0;border-radius:0;background:none;color:#fff;cursor:pointer;font:inherit;padding:0;width:48px;height:48px;font-size:26px;line-height:48px;text-align:center}
.ybss-lb button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ybss-lb__close{top:16px;right:16px;font-size:32px!important}
.ybss-lb__prev{left:16px;top:50%;transform:translateY(-50%)}
.ybss-lb__next{right:16px;top:50%;transform:translateY(-50%)}
.ybss-lb__count{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#fff;opacity:.75;font-size:12px;letter-spacing:.08em}
@media (max-width:640px){.ybss-lb__img{max-width:100vw;max-height:calc(100vh - 140px)}.ybss-lb__prev,.ybss-lb__next{top:auto!important;bottom:6px;transform:none!important}}
html.ybss-lock,html.ybss-lock body{overflow:hidden}
@media (prefers-reduced-motion:reduce){.ybss__slide{transition:none}}
</style>

<script>
(function () {
  /* ===================== SETTINGS ===================== */
  var SECONDS_PER_PHOTO = 4;      // how long each photo stays before the next one
  var ASPECT_RATIO = '4/5';       // shape of the frame: '4/5' portrait, '1/1' square, '3/2' landscape
  /* ===================== PHOTOS =======================
     One line per photo: the image address, then a short description (used by screen readers).
     Image addresses: see the instructions that came with this code.                        */
  var PHOTOS = [
    ['PASTE-IMAGE-ADDRESS-1', 'The Power & Energy column being installed'],
    ['PASTE-IMAGE-ADDRESS-2', 'Street mural: a portrait with a lightbulb hat'],
    ['PASTE-IMAGE-ADDRESS-3', 'A pastry case of custard tarts']
  ];
  /* ============ nothing below needs editing ============ */

  var root = document.currentScript && document.currentScript.parentNode.querySelector('[data-ybss]:not([data-ybss-ready])')
          || document.querySelector('[data-ybss]:not([data-ybss-ready])');
  if (!root || !PHOTOS.length) return;
  root.setAttribute('data-ybss-ready', '');
  root.style.setProperty('--ybss-ratio', ASPECT_RATIO);

  var sqs = /squarespace(-cdn)?\.com/;
  function sized(src, w) { return sqs.test(src) ? src.split('?')[0] + '?format=' + w + 'w' : src; }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var n = PHOTOS.length, i = 0, timer = null, playing = !reduce, hovering = false, visible = true, lbOpen = false;

  root.setAttribute('role', 'region');
  root.setAttribute('aria-roledescription', 'carousel');
  root.setAttribute('aria-label', 'Snapshots of What I’ve Been Up To');
  var holder = root.querySelector('.ybss__slides'), count = root.querySelector('.ybss__count'), playBtn = root.querySelector('.ybss__play');
  holder.setAttribute('aria-live', 'off');

  var slides = PHOTOS.map(function (p, k) {
    var f = document.createElement('figure'); f.className = 'ybss__slide';
    f.setAttribute('role', 'group'); f.setAttribute('aria-roledescription', 'slide'); f.setAttribute('aria-label', (k + 1) + ' of ' + n);
    var img = document.createElement('img'); img.alt = p[1] || ''; img.decoding = 'async';
    img.setAttribute('data-src', sized(p[0], 1000));
    if (k === 0) img.src = img.getAttribute('data-src');
    f.appendChild(img);
    f.addEventListener('click', function () { openLb(k); });
    holder.appendChild(f); return f;
  });
  function load(k) { var img = slides[(k + n) % n].firstChild; if (!img.src) img.src = img.getAttribute('data-src'); }

  function show(k) {
    slides[i].classList.remove('is-on'); slides[i].setAttribute('aria-hidden', 'true');
    i = (k + n) % n;
    load(i); load(i + 1);
    slides[i].classList.add('is-on'); slides[i].removeAttribute('aria-hidden');
    count.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0');
  }
  function tick() {
    clearTimeout(timer);
    if (playing && !hovering && visible && !lbOpen && !document.hidden && n > 1)
      timer = setTimeout(function () { show(i + 1); tick(); }, SECONDS_PER_PHOTO * 1000);
  }
  function setPlaying(on) {
    playing = on;
    playBtn.setAttribute('aria-label', on ? 'Pause slideshow' : 'Play slideshow');
    playBtn.firstChild.textContent = on ? 'Pause' : 'Play';
    holder.setAttribute('aria-live', on ? 'off' : 'polite');
    tick();
  }
  slides.forEach(function (s, k) { if (k) s.setAttribute('aria-hidden', 'true'); });
  show(0);
  if (n < 2) { root.querySelectorAll('.ybss__arrow,.ybss__play').forEach(function (b) { b.hidden = true; }); }

  root.querySelector('.ybss__arrow--prev').addEventListener('click', function () { show(i - 1); tick(); });
  root.querySelector('.ybss__arrow--next').addEventListener('click', function () { show(i + 1); tick(); });
  playBtn.addEventListener('click', function () { setPlaying(!playing); });
  root.addEventListener('mouseenter', function () { hovering = true; tick(); });
  root.addEventListener('mouseleave', function () { hovering = false; tick(); });
  root.addEventListener('focusin', function () { hovering = true; tick(); });
  root.addEventListener('focusout', function () { hovering = false; tick(); });
  document.addEventListener('visibilitychange', tick);
  if ('IntersectionObserver' in window)
    new IntersectionObserver(function (e) { visible = e[0].isIntersecting; tick(); }, { threshold: 0.2 }).observe(root);
  swipe(root.querySelector('.ybss__frame'), function (d) { show(i + d); tick(); });

  /* ---------- lightbox ---------- */
  var lb = document.createElement('div'); lb.className = 'ybss-lb';
  lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', 'Photo viewer');
  lb.innerHTML = '<img class="ybss-lb__img" alt="">' +
    '<button type="button" class="ybss-lb__prev" aria-label="Previous photo">&#8592;</button>' +
    '<button type="button" class="ybss-lb__next" aria-label="Next photo">&#8594;</button>' +
    '<button type="button" class="ybss-lb__close" aria-label="Close">&times;</button>' +
    '<div class="ybss-lb__count" aria-live="polite"></div>';
  document.body.appendChild(lb);
  var lbImg = lb.querySelector('.ybss-lb__img'), lbCount = lb.querySelector('.ybss-lb__count'), lbAt = 0, opener = null;
  function lbShow(k) {
    lbAt = (k + n) % n;
    lbImg.src = sized(PHOTOS[lbAt][0], 2500); lbImg.alt = PHOTOS[lbAt][1] || '';
    lbCount.textContent = (lbAt + 1) + ' / ' + n;
    new Image().src = sized(PHOTOS[(lbAt + 1) % n][0], 2500);
  }
  function openLb(k) {
    opener = document.activeElement; lbOpen = true; tick();
    lbShow(k); lb.classList.add('is-open'); document.documentElement.classList.add('ybss-lock');
    lb.querySelector('.ybss-lb__close').focus();
  }
  function closeLb() {
    lb.classList.remove('is-open'); document.documentElement.classList.remove('ybss-lock'); lbOpen = false;
    show(lbAt); tick();
    if (opener && opener.focus) opener.focus();
  }
  lb.querySelector('.ybss-lb__prev').addEventListener('click', function () { lbShow(lbAt - 1); });
  lb.querySelector('.ybss-lb__next').addEventListener('click', function () { lbShow(lbAt + 1); });
  lb.querySelector('.ybss-lb__close').addEventListener('click', closeLb);
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function (e) {
    if (!lbOpen) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft') lbShow(lbAt - 1);
    else if (e.key === 'ArrowRight') lbShow(lbAt + 1);
    else if (e.key === 'Tab') {   // keep keyboard focus inside the viewer
      var b = lb.querySelectorAll('button'), first = b[0], last = b[b.length - 1];
      if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
    }
  });
  swipe(lb, function (d) { lbShow(lbAt + d); });
  if (n < 2) { lb.querySelector('.ybss-lb__prev').hidden = lb.querySelector('.ybss-lb__next').hidden = true; }
  setPlaying(playing);   // sets the Play/Pause label and starts the timer

  function swipe(el, go) {
    var x0 = null, y0 = 0;
    el.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    }, { passive: true });
  }
})();
</script>
