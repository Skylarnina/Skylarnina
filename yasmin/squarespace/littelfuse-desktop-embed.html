      cap.innerHTML = '<b>' + pad(at + 1) + ' / ' + pad(list.length) + '</b>' + esc(s[1]);
      stepBtns.forEach(function (b, j) { b.setAttribute('aria-selected', j === at ? 'true' : 'false'); });
      D.querySelector('.lfx__prev').disabled = at === 0; D.querySelector('.lfx__next').disabled = at === list.length - 1;
      if (list[at + 1]) new Image().src = sized(list[at + 1][0], 1500);
    }
    D.querySelector('.lfx__prev').addEventListener('click', function () { show(at - 1); });
    D.querySelector('.lfx__next').addEventListener('click', function () { show(at + 1); });
    function openFull() { var set = toSet([DESKTOP[flow]], false); lbOpen(set, at); }
    D.querySelector('.lfx__full').addEventListener('click', openFull);
    var down = null;
    vp.addEventListener('pointerdown', function (e) { down = [e.clientX, e.clientY]; });
    vp.addEventListener('click', function (e) { if (down && Math.abs(e.clientX - down[0]) + Math.abs(e.clientY - down[1]) < 6) openFull(); });
    vp.addEventListener('keydown', function (e) { if (e.key === 'Enter') openFull(); });
    pickFlow(0);
  }

  /* ---------- mobile: phone row ---------- */
  var M = root.querySelector('[data-part="mobile"]');
  if (M && !MOBILE.length) M.hidden = true; else if (M) {
    var row = M.querySelector('.lfx__row'), all = toSet(MOBILE, true), mtabs = tabs(M.querySelector('.lfx__mflows'), ['All'].concat(MOBILE.map(function (g) { return g[0]; })), function (k) { pickGroup(k); });
    function pickGroup(k) {
      mtabs.forEach(function (b, i) { b.setAttribute('aria-selected', i === k ? 'true' : 'false'); });
      var set = k ? toSet([MOBILE[k - 1]], true) : all; row.innerHTML = ''; row.scrollLeft = 0;
      set.forEach(function (s, i) {
        var f = el('figure', 'lfx__phone');
        f.innerHTML = '<div class="lfx__device"><div class="lfx__pscreen" tabindex="0" role="button" aria-label="Enlarge: ' + esc(s.cap) + '">' +
          '<img loading="lazy" alt="' + esc(s.cap) + '" width="' + s.w + '" height="' + s.h + '" src="' + esc(s.small || sized(s.src, 750)) + '"></div></div>' +
          '<figcaption><b>' + esc(s.flow) + '</b>' + esc(s.cap) + '</figcaption>';
        var p = f.querySelector('.lfx__pscreen'), d0 = null;
        p.addEventListener('pointerdown', function (e) { d0 = [e.clientX, e.clientY]; });
        p.addEventListener('click', function (e) { if (d0 && Math.abs(e.clientX - d0[0]) + Math.abs(e.clientY - d0[1]) < 6) lbOpen(set, i); });
        p.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lbOpen(set, i); } });
        row.appendChild(f);
      });
    }
    function page(dir) { row.scrollBy({ left: dir * row.clientWidth * 0.9, behavior: 'smooth' }); }
    M.querySelector('.lfx__rprev').addEventListener('click', function () { page(-1); });
    M.querySelector('.lfx__rnext').addEventListener('click', function () { page(1); });
    pickGroup(0);
  }
})();
